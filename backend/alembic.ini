# backend/alembic.ini -- Alembic configuration for Plexive.
#
# WHAT THIS IS FOR. The schema used to be built by Base.metadata.create_all at
# boot (app/main.py:_run_startup_ddl), which creates missing TABLES and never
# adds a COLUMN to an existing one, plus 17 hand-run scripts in scripts/ with no
# record of what was applied. Alembic is the ledger that record was missing.
#
# ----------------------------------------------------------------------------
# READ THIS BEFORE RUNNING `alembic revision --autogenerate`:
#
#   AUTOGENERATE CANNOT DETECT A RENAME. It renders a renamed column as a DROP
#   plus an ADD, which silently destroys that column's data. Alembic's own
#   documentation says candidate migrations must always be reviewed by hand.
#   The same warning sits at the top of every file alembic/script.py.mako
#   generates, because that is where someone about to run it will actually see
#   it.
# ----------------------------------------------------------------------------
#
# THERE IS DELIBERATELY NO `sqlalchemy.url` HERE. A URL in this file would be a
# second definition of where the database lives, free to disagree with the one
# the application uses. alembic/env.py takes app.database.DATABASE_URL instead
# -- literally the same variable app/database.py reads -- and prints the host it
# resolved before it connects.
#
# WRITES REQUIRE AN OPT-IN. upgrade / downgrade / stamp / merge refuse to run
# unless PLEXIVE_DB_WRITE=1 is set. See the comment block in alembic/env.py.
#
# Usage, from backend/ :
#   .venv/Scripts/alembic.exe current             # read-only
#   .venv/Scripts/alembic.exe check               # read-only, needs a stamped DB
#   .venv/Scripts/python.exe scripts/schema_diff.py   # read-only, works UNSTAMPED
#   PLEXIVE_DB_WRITE=1 .venv/Scripts/alembic.exe stamp head

[alembic]
script_location = %(here)s/alembic

# Migration filenames: <revision>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# So that `from app import ...` resolves when alembic runs from backend/.
prepend_sys_path = .

path_separator = os

# Logging. Alembic's own messages at INFO; SQLAlchemy's engine chatter stays off
# so the announce line in env.py is not buried.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
