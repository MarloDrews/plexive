#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Plexive
# The backend address, read at build time by the generateApiConfig task in shared/build.gradle.kts.
# This is the one value to change when the backend moves off the Raspberry Pi. Do not put a local
# address here: this file is committed. Override it for this machine in ~/.gradle/gradle.properties,
# or for one build with -Pplexive.api.baseUrl=http://10.0.2.2:8000 (10.0.2.2 is how an Android
# emulator reaches the host). A release build rejects anything that is not https.
plexive.api.baseUrl=https://api.plexive.org
