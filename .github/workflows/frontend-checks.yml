# Runs the web frontend's checks on every pull request, and on main after a merge.
#
# The frontend already had node:test suites, TypeScript strict mode and npm scripts. Nothing ran them,
# and Vercel deploys main automatically, so until now nothing stood between a merge and production.
name: Frontend checks

on:
  # Scoped to main for the same reason as android-build.yml: an unscoped "push:" also fires on the
  # branch behind a pull request, so one commit gets two runs reporting the same frontend-checks name
  # and the required check resolves to whichever finishes last.
  #
  # Deliberately no "paths:" filter. A workflow skipped by a top-level paths filter reports no status
  # at all, and a required check that never reports blocks the pull request permanently.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-checks:
    # This name is the identity of the required status check on main. Do not rename it casually.
    name: frontend-checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        # The Linux default shell is "bash -e {0}", without pipefail. npm test below is piped into tee
        # so its summary can be parsed, and without pipefail a failing test run would exit 0 through
        # tee and report a green check. "shell: bash" is "bash --noprofile --norc -eo pipefail {0}".
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # 24 because local dev and the Pi both run v24.16.0, so it is the only major this code is known
      # to run on. Nothing in the project pins a Node version -- no .nvmrc, no .node-version, no
      # engines field -- which makes this line the de facto pin.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules)" ]; then
            echo "FAIL: npm ci left no node_modules, so every step after this would test nothing."
            exit 1
          fi

      # "node --test" over a directory that matches no test file exits 0 and prints "pass 0". That is
      # the silent failure this guards against, so the summary is parsed rather than trusted.
      #
      # The summary lines look like "i tests 40" / "i pass 40" / "i fail 0" with a leading unicode
      # info glyph, so awk matches on the second-to-last field and ignores the glyph entirely.
      - name: Tests
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"

          # If the summary is absent the parse below silently yields 0 and the comparison against an
          # empty string is a shell error, not a failure, so the step would pass having proved nothing.
          # Assert the lines exist before reading them.
          if ! grep -qE '(^|[[:space:]])pass[[:space:]]+[0-9]+[[:space:]]*$' "$RUNNER_TEMP/test.log"; then
            echo "FAIL: no test summary in the output; the runner reported no pass count."
            exit 1
          fi

          # "NF >= 2" matters: $(NF-1) on a blank line is a fatal awk error, and the log has blank
          # lines. Matching on the second-to-last field ignores the leading unicode info glyph.
          pass=$(awk 'NF >= 2 && $(NF-1) == "pass" { p = $NF } END { print p + 0 }' "$RUNNER_TEMP/test.log")
          fail=$(awk 'NF >= 2 && $(NF-1) == "fail" { f = $NF } END { print f + 0 }' "$RUNNER_TEMP/test.log")
          skipped=$(awk 'NF >= 2 && $(NF-1) == "skipped" { s = $NF } END { print s + 0 }' "$RUNNER_TEMP/test.log")
          echo "parsed: pass=$pass fail=$fail skipped=$skipped"

          # A skip is not a pass, and this job would otherwise report only the pass count, which is
          # exactly how a shrinking suite stays green. The 8 gold tests in gold-routing-scan.test.mjs
          # read content that left this repository on 2026-08-29, so they SKIP here and run only where
          # PLEXIVE_CONTENT_REPO points at a clone that has it. That is a known, deliberate gap, and
          # this line is what keeps it visible instead of silent. It does not fail the job: the gap is
          # a decision, not a regression.
          if [ "$skipped" -gt 0 ]; then
            echo "NOTE: $skipped tests were SKIPPED, not run. Expected 8 here (the gold-routing scan;"
            echo "      its golds live in the private content repository). Their skip reasons are in"
            echo "      the log above and name PLEXIVE_CONTENT_REPO."
          fi

          # A floor, not the exact count. 97 tests across 9 files measured 2026-08-31 -- 89 passing
          # plus the 8 skipped gold tests -- when feedPaging.test.mjs landed; 78 across 8 files
          # (70 passing) earlier the same day, when gate-coverage.test.mjs landed; 64 across 7 files
          # (56 passing) on 2026-08-29, against 60 (52 passing) earlier the same day, before
          # taxonomy-drift.test.mjs gained the four axis-2 and FORMAT_INTEREST_SLUGS assertions;
          # 53 across 6 files (45 passing) before that file existed at all, and 40 across 5 files
          # when this was written. The floor STAYS AT 40 because 89 still clears it: raising it to each new observed count is how a
          # floor ends up above what a later legitimate deletion leaves, which reds correct work. It
          # only moves down through a deliberate deletion, which is worth a deliberate edit here.
          if [ "$pass" -lt 40 ]; then
            echo "FAIL: only $pass tests passed, expected at least 40."
            echo "Either tests were deleted or the runner matched no files and proved nothing."
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: $fail tests failed."
            exit 1
          fi

      # ESLint had a flat config, a devDependency and an npm script in this repository from the day
      # the frontend was created, and no workflow ran it. next build does not lint either -- Next 16
      # dropped that -- so nothing stood between a commit and Vercel's deploy of main.
      #
      # This step is a RATCHET, not a clean-tree gate, and that is what the earlier reasoning here
      # missed. "It reports 88 errors, so it cannot gate anything" treats a measured count as a
      # blocker; the count IS the gate. 88 errors and 13 warnings on tracked files, measured
      # 2026-08-30 at 978c372, so the job refuses the 89th error and says nothing about the first 88.
      #
      # THE FLOOR ONLY FIRES UPWARD. There is deliberately no lower bound and no equality check,
      # because a gate that reds when someone FIXES three errors is a gate firing on correct work,
      # which is the inverse defect CLAUDE.md keeps apart from the rest. MAX_ERRORS comes down by
      # hand, in the same commit as the batch that fixes the findings, and never on its own.
      #
      # Errors and warnings are two numbers and only one of them is floored. The warning count is
      # printed so it exists and can be read later; nothing compares it.
      - name: Lint
        run: |
          # Pinned the way ruff==0.16.4 is pinned in backend-checks.yml: an unpinned linter changes
          # its own rules under you and reds the gate on a day nobody touched the code. package.json
          # says "eslint": "^9", so package-lock.json is the real pin and this line is what turns a
          # lockfile bump into a red check instead of a silently different count. eslint-config-next
          # is already pinned exactly at 16.2.11, and it is what supplies the rule set.
          ESLINT_PIN=9.39.4

          # The ratchet. See the comment above for which direction it fires in.
          MAX_ERRORS=88

          # COLLAPSE DETECTOR, the same kind as the Syntax check floor in backend-checks.yml and set
          # the same way, well below the observed count: a checkout of this branch gives ESLint 246
          # files, and 248 on the dev laptop (two untracked files under .design-sync, no findings).
          # A flat config that resolves to no files exits 0 having reported 0 errors, and that is the
          # reassuring output this whole file exists to refuse.
          MIN_FILES=150

          # next/core-web-vitals turns on 6 jsx-a11y rules, all at severity 1, and they find NOTHING
          # on this tree. Zero findings from zero active rules and zero findings from six active
          # rules are the same output, so the RULES are counted off the resolved config rather than
          # the silence being trusted. Any drop below 6 means eslint-config-next stopped shipping
          # them and the accessibility half of this check quietly went away.
          #
          # THE PROBE IS CHOSEN, NOT NAMED, and that is the fix for a check that used to red on
          # correct work. It was A11Y_PROBE=src/components/PostCard.tsx with an exists-or-exit-1
          # guard, so MOVING ONE COMPONENT -- ordinary refactoring, zero new lint errors -- red
          # frontend-checks, which is a required check on main. Reproduced 2026-08-31, not argued.
          # What this probe has to be is a file THE RESOLVED CONFIG COVERS; which file that is does
          # not matter, so it is taken from the report eslint has just written, below, rather than
          # written down here. src/ is preferred over any other .tsx the config covers, because the
          # first entry in directory order is under .design-sync/previews/ -- tracked, linted, and
          # not where the accessibility rules earn their place.
          #
          # WHAT THIS GIVES UP, said out loud: deleting one named component no longer reds this
          # step. One surviving .tsx the config covers is now enough. That is the trade -- a
          # property that must hold in place of the identity of a file that happens to exist.
          MIN_A11Y_RULES=6

          # --no-install matters. Without it a missing local eslint makes npx fetch eslint@latest
          # from the registry, which is exactly the "the tool moved" failure the pin exists to stop.
          have=$(npx --no-install eslint --version)
          echo "eslint $have (pinned v$ESLINT_PIN)"
          if [ "$have" != "v$ESLINT_PIN" ]; then
            echo "FAIL: eslint resolved $have, expected v$ESLINT_PIN."
            echo "The lockfile moved, so the counts below are not comparable to MAX_ERRORS=$MAX_ERRORS."
            exit 1
          fi

          # eslint exits 1 when it finds errors, and this shell runs under -e, so the exit code is
          # captured rather than allowed to end the step. The classification below is the point:
          # 0 and 1 both mean it ran, anything else means it did not lint at all.
          rc=0
          npx --no-install eslint --format json -o "$RUNNER_TEMP/eslint.json" || rc=$?
          echo "eslint exit $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "FAIL: eslint exited $rc, which is not 'ran and reported' (0 clean, 1 findings)."
            echo "2 is a config or CLI error. It did not lint, so it proved nothing."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/eslint.json" ]; then
            echo "FAIL: eslint wrote no JSON report, so there is nothing to count."
            exit 1
          fi

          # The probe, taken from what eslint just linted. Every path in the report is a file the
          # resolved config covers, which is exactly the property --print-config needs and is why
          # this cannot be a name written above. Printing the count as well as the choice: one
          # .tsx and two hundred are both "found something", and only the number says which.
          A11Y_PROBE=$(REPORT="$RUNNER_TEMP/eslint.json" node -e '
            const fs = require("node:fs"), path = require("node:path");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            const tsx = report
              .map((f) => path.relative(process.cwd(), f.filePath).split(path.sep).join("/"))
              .filter((p) => p.endsWith(".tsx"));
            const src = tsx.filter((p) => p.startsWith("src/"));
            console.error("config covers " + tsx.length + " .tsx files, " + src.length + " under src/");
            console.log((src[0] || tsx[0]) || "");
          ')
          if [ -z "$A11Y_PROBE" ]; then
            echo "FAIL: the resolved config covers no .tsx file at all, so the jsx-a11y rule count"
            echo "has nothing to probe. Either the config collapsed or every component left."
            exit 1
          fi
          echo "a11y probe: $A11Y_PROBE"
          npx --no-install eslint --print-config "$A11Y_PROBE" > "$RUNNER_TEMP/eslint-config.json"
          if [ ! -s "$RUNNER_TEMP/eslint-config.json" ]; then
            echo "FAIL: eslint --print-config wrote nothing for $A11Y_PROBE."
            exit 1
          fi

          MAX_ERRORS="$MAX_ERRORS" MIN_FILES="$MIN_FILES" MIN_A11Y_RULES="$MIN_A11Y_RULES" \
          REPORT="$RUNNER_TEMP/eslint.json" CONFIG="$RUNNER_TEMP/eslint-config.json" \
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const report = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG, "utf8"));
          const maxErrors = Number(process.env.MAX_ERRORS);
          const minFiles = Number(process.env.MIN_FILES);
          const minA11yRules = Number(process.env.MIN_A11Y_RULES);

          // A rule entry is either a severity or [severity, ...options].
          const severityOf = (entry) => (Array.isArray(entry) ? entry[0] : entry);
          const configured = config.rules || {};
          const a11yRules = Object.keys(configured).filter((name) => {
            if (!name.startsWith("jsx-a11y/")) return false;
            const severity = severityOf(configured[name]);
            return severity !== 0 && severity !== "off";
          });

          let errors = 0;
          let warnings = 0;
          let a11yErrors = 0;
          let a11yWarnings = 0;
          const byRule = new Map();
          const errorLines = [];

          for (const file of report) {
            errors += file.errorCount;
            warnings += file.warningCount;
            const rel = path.relative(process.cwd(), file.filePath).split(path.sep).join("/");
            for (const message of file.messages) {
              const rule = message.ruleId || "(no rule)";
              byRule.set(rule, (byRule.get(rule) || 0) + 1);
              if (rule.startsWith("jsx-a11y/")) {
                if (message.severity === 2) a11yErrors += 1;
                else a11yWarnings += 1;
              }
              if (message.severity === 2) {
                errorLines.push(rel + ":" + message.line + ":" + message.column + " " + rule);
              }
            }
          }

          console.log("linted " + report.length + " files");
          console.log("errors=" + errors);
          console.log("warnings=" + warnings);
          console.log(
            "jsx-a11y: " + a11yRules.length + " rules active, " +
            a11yErrors + " errors, " + a11yWarnings + " warnings",
          );

          console.log("--- findings by rule ---");
          for (const [rule, count] of [...byRule].sort((a, b) => b[1] - a[1])) {
            console.log("  " + count + "  " + rule);
          }
          if (errorLines.length > 0) {
            console.log("--- the " + errorLines.length + " error-severity findings ---");
            for (const line of errorLines) console.log("  " + line);
          }

          // Every failure is reported, not just the first, so one round trip shows all of them.
          const failures = [];

          if (report.length < minFiles) {
            failures.push(
              "FAIL: eslint linted " + report.length + " files, expected at least " + minFiles + ".\n" +
              "      The config resolved to almost nothing, so the error count of " + errors + " proves nothing.",
            );
          }

          if (a11yRules.length < minA11yRules) {
            failures.push(
              "FAIL: " + a11yRules.length + " jsx-a11y rules are active, expected at least " +
              minA11yRules + ".\n" +
              "      They come from next/core-web-vitals. With them off, 0 accessibility findings\n" +
              "      is silence rather than a clean tree.",
            );
          }

          if (errors > maxErrors) {
            failures.push(
              "FAIL: " + errors + " errors, above the floor of " + maxErrors + ".\n" +
              "      This job refuses NEW errors and accepts the " + maxErrors + " already here.\n" +
              "      Fix the ones this branch added, or lower MAX_ERRORS in the same commit as the\n" +
              "      batch that fixes findings. It never comes down on its own.",
            );
          }

          for (const failure of failures) console.log(failure);
          if (failures.length > 0) process.exit(1);

          console.log(
            "OK: " + errors + " errors (floor " + maxErrors + "), " + warnings +
            " warnings (not floored), across " + report.length + " files.",
          );
          JS

      # next build type-checks internally under tsconfig strict: true, so it is a superset of a
      # separate "tsc --noEmit" and that is not run. It does NOT run ESLint -- Next 16 dropped that --
      # which is why the Lint step above exists as its own step rather than as a side effect of this
      # one. Lint runs BEFORE it, so a lint failure does not cost a build first.
      - name: Build
        run: |
          npm run build

          # A build can print a route table and still have produced nothing. Assert on the artefacts:
          # BUILD_ID only exists after a completed build, and the manifest is the route list Next
          # actually emitted, which beats parsing the box-drawing table off the console.
          if [ ! -s .next/BUILD_ID ]; then
            echo "FAIL: .next/BUILD_ID is missing or empty, so no build completed."
            exit 1
          fi

          manifest=.next/app-path-routes-manifest.json
          if [ ! -s "$manifest" ]; then
            echo "FAIL: $manifest is missing, so the route count cannot be asserted."
            exit 1
          fi
          routes=$(node -e "console.log(Object.keys(require('./$manifest')).length)")
          echo "build emitted $routes app routes (BUILD_ID $(cat .next/BUILD_ID))"

          # A floor, not the observed number. 17 entries when this was written; the route list grows
          # with the product, so an exact assertion would red the gate during correct work.
          if [ "$routes" -lt 5 ]; then
            echo "FAIL: $routes routes is below the floor of 5; the build emitted almost nothing."
            exit 1
          fi
