# Builds the Android target of mobile-kmp/ on every pull request, and on main after a merge.
#
# mobile-kmp/ is a standalone Gradle build with its own settings file and wrapper, and there is no
# settings file at the repository root, so Gradle has to be invoked from inside that directory.
name: Android build

on:
  # Scoped to main on purpose. An unscoped "push:" also fires on the branch behind a pull request,
  # so the same commit gets two runs reporting the same android-build check name, and the required
  # check then resolves to whichever finishes last: a pull request where one run fails and the other
  # passes has an ordering-dependent outcome. Do not widen this to make branches build. Branches
  # build through their pull request, which is the thing the check actually gates.
  #
  # Keeping main here is what seeds the dependency cache, because setup-gradle only writes the cache
  # from the default branch. Removing it would leave every run cold.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-build:
    # This name is the identity of the required status check on main. Do not rename it casually.
    name: android-build
    runs-on: ubuntu-24.04
    defaults:
      run:
        # The Linux default shell is "bash -e {0}", without pipefail. Piping Gradle into tee under
        # that default would hide a compile failure behind tee's exit code and report a green job on
        # a broken build. "shell: bash" is "bash --noprofile --norc -eo pipefail {0}".
        shell: bash
        working-directory: mobile-kmp
    steps:
      - uses: actions/checkout@v5

      # mobile-kmp/gradle/gradle-daemon-jvm.properties pins the daemon JVM to vendor AMAZON, so a
      # Temurin JDK does not satisfy it and Gradle downloads Corretto 21 from foojay on every run.
      # Corretto here matches the pin and keeps the build off that network dependency.
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      # Dependency caching (Gradle User Home) stays on. Task-output caching is a different cache and
      # is disabled on the Gradle invocation below, so no task result is ever reused or written.
      - uses: gradle/actions/setup-gradle@v4

      # ONE Gradle invocation for all three tasks, not three invocations. One configuration phase,
      # one daemon, and lint analyses the classes assembleDebug has just produced instead of
      # rebuilding them. It also keeps this job on a single --console=plain log, which is what the
      # three assertion steps below parse and what the comment in dependency-submission.yml means
      # when it says this job parses only its own log.
      #
      # WHICH TEST TASK, because Kotlin Multiplatform registers several and running the wrong one is
      # a task that passes having done nothing. :shared:allTests aggregates iosSimulatorArm64Test,
      # which is DISABLED off macOS -- measured, the Kotlin plugin prints "Native task
      # 'iosSimulatorArm64Test' is disabled / cannot run on the current host / Reason: simulator
      # tests require macOS". :shared:testAndroidHostTest is the JVM host test task and is the only
      # one that runs on this runner. :androidApp:testDebugUnitTest exists but androidApp/src has no
      # test directory at all.
      #
      # lintDebug rather than lint: "lint" means "the default variant", so it moves if the default
      # ever does, while lintDebug names the variant this job already builds.
      #
      # Without --continue Gradle stops at the first failing task, so a failing test never reaches
      # lint. That is deliberate: the cheaper signal is the one worth reading first.
      - name: Build the debug APK, run the Kotlin host tests, run lint
        run: |
          ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest :androidApp:lintDebug \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # A green check that proves nothing is worse than no check. Gradle prints one outcome line per
      # task under --console=plain: a task that really executed carries no suffix, while FROM-CACHE,
      # UP-TO-DATE, NO-SOURCE and SKIPPED all mean the work was not done. This step fails the job if
      # a compile task is missing from the output or carries any such suffix.
      #
      # The task names below were read out of a real run of this build, not guessed. The shared
      # module uses the AGP Kotlin Multiplatform library plugin, whose Kotlin compile task is
      # compileAndroidMain, not compileDebugKotlinAndroid. A pattern like "compile*Kotlin" matches
      # only androidApp and would leave the module holding the actual application code unchecked.
      - name: Assert the Kotlin compile tasks executed
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ ! -s "$log" ]; then
            echo "FAIL: $log is missing or empty, so nothing can be asserted about the build."
            exit 1
          fi

          status=0
          for task in :shared:compileAndroidMain :androidApp:compileDebugKotlin; do
            lines=$(grep -E "^> Task ${task}([[:space:]]|$)" "$log" || true)
            if [ -z "$lines" ]; then
              echo "FAIL: ${task} never appeared in the build output."
              status=1
              continue
            fi
            while IFS= read -r line; do
              # Whatever follows the task path is the outcome suffix. Empty means it really ran.
              outcome=$(printf '%s' "${line#"> Task ${task}"}" | tr -d '[:space:]')
              if [ -n "$outcome" ]; then
                echo "FAIL: ${task} did not execute (${outcome})."
                status=1
              else
                echo "OK: ${task} executed."
              fi
            done <<< "$lines"
          done
          exit $status

      # THE TEST TASK IS WIRED AND THE TEST SOURCE SET IS EMPTY, and those are two different facts
      # that this step keeps apart rather than merging into one green tick.
      #
      # Measured 2026-08-30 on this tree: with zero test files Gradle prints
      #   > Task :shared:compileAndroidHostTest NO-SOURCE
      #   > Task :shared:testAndroidHostTest NO-SOURCE
      # and exits 0. That is the reassuring output CLAUDE.md's "## Rules" entry is about, so the
      # step below refuses to read it as a pass. It reports the file count and the executed-test
      # count as numbers, and says out loud which of the two branches it took.
      #
      # The harness itself WAS proven, by hand and not by reasoning: one deliberately failing test
      # at shared/src/commonTest/kotlin/com/plexive/mobile/HarnessProofTest.kt made this same task
      # print "1 test completed, 1 failed", "> Task :shared:testAndroidHostTest FAILED" and exit 1.
      # It was deleted the same session. That run also established that commonTest feeds the
      # androidHostTest compilation, which is why commonTest is one of the two directories counted
      # below. Workings: plexive-docs/research/android-gate-wiring-2026-08-30.md.
      - name: Assert the Kotlin host test task ran, and count the tests
        run: |
          log="$RUNNER_TEMP/gradle.log"
          task=":shared:testAndroidHostTest"

          if [ ! -s "$log" ]; then
            echo "FAIL: $log is missing or empty, so nothing can be asserted about the test run."
            exit 1
          fi

          # A MISSING task line is the loud case and it fails unconditionally, empty source set or
          # not. The task exists because of the withHostTest {} block in shared/build.gradle.kts;
          # delete that block and the task is gone, this job runs no tests, and nothing else here
          # would notice.
          lines=$(grep -E "^> Task ${task}([[:space:]]|$)" "$log" || true)
          if [ -z "$lines" ]; then
            echo "FAIL: ${task} never appeared in the build output, so no test task ran at all."
            echo "It is registered by the withHostTest {} block in shared/build.gradle.kts."
            exit 1
          fi
          echo "$lines"

          # Whatever follows the task path is the outcome suffix, read exactly as the compile
          # assertion above reads its own. Empty means the task really executed.
          outcome=$(printf '%s\n' "$lines" | tail -n 1 | sed "s|^> Task ${task}||" | tr -d '[:space:]')

          # Both directories, because a test may be written in either. commonTest is the one proven
          # to reach this task; androidHostTest is the Android-only half of the same compilation.
          #
          # The existence test is not defensive noise. Neither directory exists on this tree, and
          # "find a b -name '*.kt'" over a missing path exits 1. Under this job's shell -- bash -eo
          # pipefail -- pipefail hands that 1 up through "| wc -l" and -e then ends the step, so the
          # job would go RED reporting nothing about the thing it was measuring. Measured: the same
          # script under a plain "bash" exits 0 and under "bash -eo pipefail" exits 1 having printed
          # nothing, which is the pair of identical-looking outcomes this file exists to tell apart.
          files=0
          for dir in shared/src/commonTest shared/src/androidHostTest; do
            if [ -d "$dir" ]; then
              found=$(find "$dir" -name '*.kt' | wc -l)
              files=$((files + found))
            fi
          done

          TEST_FILES="$files" OUTCOME="$outcome" TASK="$task" MIN_TESTS=1 \
          RESULTS=shared/build/test-results/testAndroidHostTest \
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = int(os.environ["TEST_FILES"])
          outcome = os.environ["OUTCOME"]
          task = os.environ["TASK"]
          min_tests = int(os.environ["MIN_TESTS"])

          reports = sorted(glob.glob(os.path.join(os.environ["RESULTS"], "*.xml")))
          tests = failures = errors = skipped = 0
          for path in reports:
              suite = ET.parse(path).getroot()
              tests += int(suite.get("tests") or 0)
              failures += int(suite.get("failures") or 0)
              errors += int(suite.get("errors") or 0)
              skipped += int(suite.get("skipped") or 0)

          print("TEST_FILES=%d" % files)
          print("TEST_RESULT_XML_FILES=%d" % len(reports))
          print("TESTS_RUN=%d failures=%d errors=%d skipped=%d" % (tests, failures, errors, skipped))
          print("task outcome suffix: %s" % (outcome if outcome else "(none, it executed)"))

          if files == 0:
              print("")
              print("NOTE: the Kotlin test source set holds ZERO test files, so there was nothing")
              print("      for %s to run. It reported %s and 0 tests."
                    % (task, outcome if outcome else "no outcome suffix"))
              print("      This job is therefore proving exactly one thing: that the test")
              print("      harness is WIRED. The task exists, this workflow reaches it, and a")
              print("      failing test in it fails the build -- that last part verified by hand")
              print("      on 2026-08-30, not assumed. It is proving NOTHING about the behaviour")
              print("      of any code in mobile-kmp/, because there is no test to prove it with.")
              print("      This is a known and deliberate state: the module is nearly empty and")
              print("      tests follow code. The first .kt file under shared/src/commonTest or")
              print("      shared/src/androidHostTest switches this step to the branch below,")
              print("      which requires the task to execute and to report at least %d test." % min_tests)
              raise SystemExit(0)

          # From here the source set is NOT empty, so silence is a defect rather than a state.
          problems = []

          if outcome:
              problems.append(
                  "FAIL: %s did not execute (%s), yet %d test files exist.\n"
                  "      NO-SOURCE with test files present means the task is looking somewhere else."
                  % (task, outcome, files)
              )

          # COLLAPSE DETECTOR. Test files present and zero tests executed is the silent failure
          # this whole step exists for: the task ran, found nothing, and exited 0.
          if tests < min_tests:
              problems.append(
                  "FAIL: %d tests executed against %d test files, expected at least %d.\n"
                  "      The task ran and discovered nothing, so its green tick means nothing."
                  % (tests, files, min_tests)
              )

          if failures or errors:
              problems.append(
                  "FAIL: %d test failures and %d errors. See the log above."
                  % (failures, errors)
              )

          if skipped:
              print("NOTE: %d tests were SKIPPED, not run. A skip is not a pass." % skipped)

          for problem in problems:
              print(problem)
          if problems:
              raise SystemExit(1)

          print("OK: %d tests executed from %d test files, 0 failures." % (tests, files))
          PY

      # AGP registers a full lint task set on :androidApp and nothing here ever called it. This step
      # calls it and ratchets the findings, the way the ESLint step in frontend-checks.yml does.
      #
      # WHAT LINT COVERS HERE IS NARROWER THAN IT LOOKS, and the number below has to be read with
      # that in mind. :shared uses the AGP Kotlin Multiplatform library plugin, which registers
      # exactly ONE lint task -- lintAnalyzeAndroidHostTest -- and no lint, no lintReport and no
      # lintAnalyzeAndroidMain. Read out of :shared:tasks --all, not guessed. So the 32 Kotlin files
      # under shared/src, which are where the application actually lives, are NOT lint analysed as
      # source; they reach lint only as the dependency AAR that bundleAndroidMainLocalLintAar builds.
      # What this step really covers is androidApp's 2 Kotlin files, its manifest and its resources.
      # Widening it needs an AGP that registers a main-source lint component for the KMP library
      # plugin, which 9.0.1 does not.
      #
      # THE FLOOR FIRES ONLY UPWARD, the same bargain as MAX_ERRORS in frontend-checks.yml. There is
      # deliberately no lower bound: a gate that reds because somebody fixed ObsoleteSdkInt is a gate
      # firing on correct work, which is the inverse defect the "## Rules" entry in CLAUDE.md keeps
      # apart from the rest. MAX_LINT_FINDINGS comes down by hand, in the same commit as the batch
      # that fixes findings, and never on its own.
      - name: Assert AGP lint ran, and ratchet its findings
        run: |
          log="$RUNNER_TEMP/gradle.log"
          report=androidApp/build/reports/lint-results-debug.xml

          # The ratchet. 3, measured HERE on 2026-08-30 and deliberately not the number the dev
          # laptop gives, which is 1. Same command, two answers, and the CI one governs because CI
          # is what gates. The three:
          #   1 ObsoleteSdkInt   androidApp/src/main/res/drawable-v24 against minSdk 24
          #   2 OldTargetApi     androidApp/build.gradle.kts:62 and gradle/libs.versions.toml:5
          # OldTargetApi fires only where a platform newer than targetSdk is installed. The laptop
          # has android-36 and android-36.1 and nothing above, so lint has nothing to compare
          # against and reports neither; the runner image ships a newer platform and reports both.
          # Both are pre-existing and identical on main -- line 62 is the targetSdk declaration and
          # is untouched by the branch that added this step. Before the two version-currency
          # detectors were disabled in androidApp/build.gradle.kts the laptop count was 21.
          MAX_LINT_FINDINGS=3

          # Pinned by assertion, the way eslint@9.39.4 is in frontend-checks.yml and ruff==0.16.4 is
          # in backend-checks.yml. Lint ships inside AGP, so libs.versions.toml's agp = "9.0.1" is
          # the real pin and this line is what turns an AGP bump into a red check rather than a
          # count that quietly moved because the rule set did.
          LINT_PIN="lint 9.0.1"

          if [ ! -s "$log" ]; then
            echo "FAIL: $log is missing or empty, so nothing can be asserted about lint."
            exit 1
          fi

          # lintDebug is a lifecycle task with no actions of its own, so these two are what is
          # asserted: the analysis and the report. Same outcome-suffix idiom as the compile step.
          status=0
          for task in :androidApp:lintAnalyzeDebug :androidApp:lintReportDebug; do
            lines=$(grep -E "^> Task ${task}([[:space:]]|$)" "$log" || true)
            if [ -z "$lines" ]; then
              echo "FAIL: ${task} never appeared in the build output, so lint did not run."
              status=1
              continue
            fi
            while IFS= read -r line; do
              outcome=$(printf '%s' "${line#"> Task ${task}"}" | tr -d '[:space:]')
              if [ -n "$outcome" ]; then
                echo "FAIL: ${task} did not execute (${outcome}), so its findings are stale."
                status=1
              else
                echo "OK: ${task} executed."
              fi
            done <<< "$lines"
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          if [ ! -s "$report" ]; then
            echo "FAIL: $report is missing or empty, so there is nothing to count."
            echo "lintReportDebug executed, so this means the report moved rather than that the"
            echo "tree is clean. A clean tree still writes the file, with zero issue elements."
            exit 1
          fi

          MAX_LINT_FINDINGS="$MAX_LINT_FINDINGS" LINT_PIN="$LINT_PIN" REPORT="$report" \
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter

          max_findings = int(os.environ["MAX_LINT_FINDINGS"])
          pin = os.environ["LINT_PIN"]
          report = os.environ["REPORT"]

          root = ET.parse(report).getroot()
          if root.tag != "issues":
              raise SystemExit(
                  "FAIL: %s has root <%s>, expected <issues>. That is not a lint report."
                  % (report, root.tag)
              )

          by = root.get("by") or ""
          print("report written by: %s (pinned %s)" % (by or "(unstated)", pin))
          if by != pin:
              print(
                  "FAIL: lint reports itself as %r, expected %r.\n"
                  "      The rule set moved, so the count below is not comparable to\n"
                  "      MAX_LINT_FINDINGS=%d. Re-measure and set the ratchet in the same commit\n"
                  "      as the AGP bump." % (by, pin, max_findings)
              )
              raise SystemExit(1)

          issues = root.findall("issue")
          by_id = Counter(issue.get("id") for issue in issues)
          by_severity = Counter(issue.get("severity") for issue in issues)

          print("LINT_FINDINGS=%d" % len(issues))
          print("by severity: %s" % (dict(by_severity) or "{}"))
          print("--- findings by id ---")
          for issue_id, count in by_id.most_common():
              print("  %d  %s" % (count, issue_id))
          for issue in issues:
              location = issue.find("location")
              where = location.get("file") if location is not None else "(no location)"
              line = location.get("line") if location is not None else None
              if line:
                  where = "%s:%s" % (where, line)
              print("  %s  %s  %s" % (issue.get("severity"), issue.get("id"), where))

          if len(issues) > max_findings:
              print(
                  "FAIL: %d lint findings, above the ratchet of %d.\n"
                  "      This job refuses NEW findings and accepts the %d already here.\n"
                  "      Fix the ones this branch added, or lower MAX_LINT_FINDINGS in the same\n"
                  "      commit as the batch that fixes findings. It never comes down on its own."
                  % (len(issues), max_findings, max_findings)
              )
              raise SystemExit(1)

          print("OK: %d lint findings, at or under the ratchet of %d." % (len(issues), max_findings))
          PY
