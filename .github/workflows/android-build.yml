# Builds the Android target of mobile-kmp/ on every push and pull request.
#
# mobile-kmp/ is a standalone Gradle build with its own settings file and wrapper, and there is no
# settings file at the repository root, so Gradle has to be invoked from inside that directory.
name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-build:
    # This name is the identity of the required status check on main. Do not rename it casually.
    name: android-build
    runs-on: ubuntu-24.04
    defaults:
      run:
        # The Linux default shell is "bash -e {0}", without pipefail. Piping Gradle into tee under
        # that default would hide a compile failure behind tee's exit code and report a green job on
        # a broken build. "shell: bash" is "bash --noprofile --norc -eo pipefail {0}".
        shell: bash
        working-directory: mobile-kmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Dependency caching (Gradle User Home) stays on. Task-output caching is a different cache and
      # is disabled on the Gradle invocation below, so no task result is ever reused or written.
      - uses: gradle/actions/setup-gradle@v4

      - name: TEMPORARY discovery - Android SDK on the runner image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- platforms ---"
          ls -1 "$ANDROID_HOME/platforms" || echo "(none)"
          echo "--- build-tools ---"
          ls -1 "$ANDROID_HOME/build-tools" || echo "(none)"
          echo "--- java on PATH ---"
          java -version

      - name: Build Android debug APK
        run: |
          ./gradlew :androidApp:assembleDebug \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: TEMPORARY discovery - task outcome lines and daemon JVM provisioning
        run: |
          echo "--- every task outcome line ---"
          grep -E '^> Task ' "$RUNNER_TEMP/gradle.log" || echo "(no task lines)"
          echo "--- auto-provisioned JDKs in the Gradle user home ---"
          ls -1 "$HOME/.gradle/jdks" 2>/dev/null || echo "(none)"
