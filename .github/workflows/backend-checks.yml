# Runs the backend's checks on every pull request, and on main after a merge.
#
# The backend was never unchecked, only unenforced: backend/tests/ is 16 suites and about 979
# assertions, and smoke_test.py had been failing for five weeks before anyone looked. This workflow is
# the thing that looks.
name: Backend checks

on:
  # Same shape as android-build.yml, and scoped to main for the same reason: an unscoped "push:" also
  # fires on the branch behind a pull request, so one commit gets two runs reporting the same
  # backend-checks name and the required check resolves to whichever finishes last.
  #
  # Deliberately no "paths:" filter. A workflow skipped by a top-level paths filter reports no status
  # at all, and a required check that never reports blocks the pull request permanently.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-checks:
    # This name is the identity of the required status check on main. Do not rename it casually.
    name: backend-checks
    runs-on: ubuntu-24.04
    # Backstop for a hang OUTSIDE the suite loop -- in pip install or the boot check -- where the
    # per-suite timeout below cannot help. Without it a hang burns toward GitHub's six-hour default,
    # which is what happened on 2026-08-27.
    #
    # About 5x the observed 3m37s-3m55s. It is deliberately not tighter, because the number is set by an
    # interaction and not by the margin alone: a job killed by timeout-minutes prints no summary table,
    # and that table is the only thing that names the suite that hung. One suite burning its full 300 s
    # puts the job near 9 minutes and two near 14, and both still print the summary inside 20.
    timeout-minutes: 20
    defaults:
      run:
        # The Linux default shell is "bash -e {0}", without pipefail, which is how a piped failure
        # turns into a green check. "shell: bash" is "bash --noprofile --norc -eo pipefail {0}".
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # 3.13 because production is 3.13.5. This used to say 3.12, on the reasoning that backend/.venv
      # is 3.12.10 and that was the only interpreter the suite had demonstrably passed on; that was
      # correct with the information available then. The Pi's freeze has since been read, and a gate
      # that tests a version nobody ships tests the wrong thing.
      #
      # The MINOR version is the pin, not the patch. Behavioural compatibility lives at the minor
      # version -- the failure this whole batch exists to fix was fastapi 0.136 against 0.141 -- and the
      # Pi's own patch level is not pinned either, so '3.13.5' here would only mirror production until
      # someone runs apt upgrade, after which the two would disagree silently. Floating the patch also
      # keeps picking up language security fixes, which we are already giving up on 69 packages.
      #
      # The Pi is on 3.13.5 today. A MINOR version bump there is a change to be matched here
      # deliberately, not discovered later.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The exact patch this run used, on its own, so a divergence from the Pi's 3.13.5 is one click
      # away in the log rather than invisible.
      - name: Python version
        run: python -V

      # Both files are now pinned to the exact versions production runs (see requirements.txt).
      # requirements-dev.txt carries httpx, which FastAPI's TestClient imports at runtime; its httpx
      # pin must equal the one in requirements.txt, and pip enforces that by failing with
      # ResolutionImpossible rather than silently choosing one.
      #
      # "time" stays because install duration is how a cache regression shows up. pip list stays as the
      # human-readable record; the machine-readable check is the next step.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          time python -m pip install -r requirements.txt -r requirements-dev.txt
          echo "--- resolved versions ---"
          python -m pip list

      # The point of pinning is not that it worked once, it is that it is still true in six months,
      # by which time nobody is reading install logs. This step is that assertion, mechanically.
      #
      # Exact equality in both directions. A package resolving HIGHER than its pin is precisely the
      # drift the pinning exists to stop, so it fails; "at least the pinned version" would pass the
      # very thing being guarded against.
      #
      # Markers: this runner is Linux, so every marker in requirements.txt is expected to resolve TRUE
      # and every marked package must therefore be present. Today that is uvloop alone. If a
      # sys_platform == "win32" marker is ever added, this check would demand a package pip correctly
      # skipped, and the fix is to evaluate the marker here rather than to delete the assertion.
      #
      # pip-audit's own transitive tree is deliberately unpinned (see requirements-dev.txt), so extra
      # packages in pip freeze that this file does not name are expected and are not an error.
      - name: Verify pins resolved
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          # Anti-vacuity guard. A parser that matches nothing compares nothing and passes green, which
          # is the exact failure class every other step here already guards against; it would be
          # embarrassing for it to land inside the step built to prevent it. 70 unique pinned names
          # across both files when this was written. It only moves down by deleting a dependency,
          # which is worth a deliberate edit here.
          MIN_PINS = 70

          pinned = {}
          for path in ("requirements.txt", "requirements-dev.txt"):
              with open(path, encoding="utf-8") as fh:
                  for raw in fh:
                      line = raw.split("#", 1)[0].strip()
                      if not line:
                          continue
                      line = line.split(";", 1)[0].strip()   # drop the environment marker
                      if "==" not in line:
                          continue
                      name, version = line.split("==", 1)
                      name = name.split("[", 1)[0].strip()   # drop extras: uvicorn[standard]
                      pinned[norm(name)] = (name, version.strip())

          print(f"parsed {len(pinned)} unique pinned packages from the two requirements files")
          if len(pinned) < MIN_PINS:
              print(f"FAIL: parsed only {len(pinned)} pins, expected at least {MIN_PINS}.")
              print("The parser matched almost nothing, so this step is comparing nothing.")
              sys.exit(1)

          frozen = {}
          for line in subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines():
              if "==" in line:
                  name, version = line.split("==", 1)
                  frozen[norm(name)] = version.strip()

          missing = sorted(k for k in pinned if k not in frozen)
          mismatched = sorted(
              (pinned[k][0], pinned[k][1], frozen[k])
              for k in pinned
              if k in frozen and frozen[k] != pinned[k][1]
          )

          for name in missing:
              print(f"MISSING: {pinned[name][0]}=={pinned[name][1]} is pinned but not installed")
          for name, want, got in mismatched:
              print(f"MISMATCH: {name} pinned {want}, resolved {got}")

          if missing or mismatched:
              print(f"FAIL: {len(missing)} missing, {len(mismatched)} mismatched.")
              print("pip did not install what the requirements files say. The pins are not in effect.")
              sys.exit(1)

          print(f"all {len(pinned)} pinned versions match what pip installed, exactly")
          PY

      # THROWAWAY PROOF STEP -- not for main. Establishes, on the real Linux runner:
      #   1. which signal actually makes faulthandler dump, since -X faulthandler covers
      #      SIGSEGV/SIGFPE/SIGABRT/SIGBUS/SIGILL and NOT the SIGTERM timeout sends today
      #   2. what exit code GNU timeout reports for each, which the loop classifies on
      #   3. whether the dump names every thread, which is the whole point for a WS race
      - name: PROOF - faulthandler mechanism probe
        run: |
          cat > "$RUNNER_TEMP/hang.py" <<'PYEOF'
          import threading, time
          def worker():
              time.sleep(600)
          threading.Thread(target=worker, name="ws-worker", daemon=True).start()
          print("probe: hanging now", flush=True)
          time.sleep(600)
          PYEOF

          # sitecustomize is the fallback candidate: it registers SIGTERM without any
          # test file being edited, because PYTHONPATH is set only for this invocation.
          mkdir -p "$RUNNER_TEMP/sc"
          cat > "$RUNNER_TEMP/sc/sitecustomize.py" <<'PYEOF'
          import faulthandler, signal, sys
          faulthandler.enable()
          faulthandler.register(signal.SIGTERM, file=sys.stderr, all_threads=True, chain=False)
          PYEOF

          # A: today's behaviour, for the baseline.
          rc=0; timeout --signal=TERM --kill-after=5s 3s python "$RUNNER_TEMP/hang.py" > "$RUNNER_TEMP/p.log" 2>&1 || rc=$?
          echo "=== CASE A: plain python, SIGTERM (today) -> EXIT $rc"; cat "$RUNNER_TEMP/p.log"

          # B: -X faulthandler with SIGTERM. Expected to NOT dump; proves the gap is real.
          rc=0; timeout --signal=TERM --kill-after=5s 3s python -X faulthandler "$RUNNER_TEMP/hang.py" > "$RUNNER_TEMP/p.log" 2>&1 || rc=$?
          echo "=== CASE B: -X faulthandler, SIGTERM -> EXIT $rc"; cat "$RUNNER_TEMP/p.log"

          # C: -X faulthandler with SIGABRT. The candidate the brief proposed.
          rc=0; timeout --signal=ABRT --kill-after=5s 3s python -X faulthandler "$RUNNER_TEMP/hang.py" > "$RUNNER_TEMP/p.log" 2>&1 || rc=$?
          echo "=== CASE C: -X faulthandler, SIGABRT -> EXIT $rc"; cat "$RUNNER_TEMP/p.log"

          # D: sitecustomize registering SIGTERM. The fallback, if C is unusable.
          rc=0; PYTHONPATH="$RUNNER_TEMP/sc" timeout --signal=TERM --kill-after=5s 3s python "$RUNNER_TEMP/hang.py" > "$RUNNER_TEMP/p.log" 2>&1 || rc=$?
          echo "=== CASE D: sitecustomize SIGTERM register -> EXIT $rc"; cat "$RUNNER_TEMP/p.log"

          # E: does either add output to a HEALTHY run? Must be silent.
          rc=0; python -X faulthandler -c "print('healthy ok')" > "$RUNNER_TEMP/p.log" 2>&1 || rc=$?
          echo "=== CASE E: healthy run under -X faulthandler -> EXIT $rc"; cat "$RUNNER_TEMP/p.log"

      # --- Cheapest first, so a failure surfaces fast. ---

      # A compileall over a path that does not exist still exits 0, so count the files first. The floor
      # is a floor, not the exact count: 100 .py files were present when this was written.
      - name: Syntax check
        run: |
          count=$(find app scripts tests -name '*.py' -not -path '*/__pycache__/*' | wc -l)
          echo "found $count Python files under app/ scripts/ tests/"
          if [ "$count" -lt 80 ]; then
            echo "FAIL: only $count Python files found, expected at least 80 (100 when this was written)."
            echo "Either the paths moved or this step is checking nothing."
            exit 1
          fi
          python -m compileall -q app scripts tests seed.py

      # The check that matters most. This backend boot-fails on purpose on a weak JWT_SECRET, a missing
      # DATABASE_URL, WEB_CONCURRENCY > 1 and an empty CORS origin list, and a boot failure crash-loops
      # systemd on the Pi and takes the API down for the web app and both mobile apps.
      # docs/SERVER.md:191-197 records that this has really happened.
      #
      # tests/_throwaway_db.py pins DATABASE_URL to a temp SQLite file and blanks the Supabase env
      # before any app module loads, so this can never reach a real database.
      #
      # The count is the number of OpenAPI paths, NOT len(app.routes), and it stays that way now that
      # fastapi is pinned. len(app.routes) was never stable across FastAPI versions -- 0.136.3 reports
      # 57, one flattened APIRoute per endpoint, while 0.141.1 (what CI resolved unpinned on
      # 2026-08-27) reports 23, because include_router leaves a single _IncludedRouter per router --
      # and with requirements.txt unpinned both were "correct" on the same day.
      #
      # Pinning fastapi==0.136.3 removes that drift, so the route count would now be stable too. It is
      # still the wrong thing to assert: the OpenAPI path count describes the API, while the route
      # count describes how the installed FastAPI happens to represent it internally. Pinning makes
      # the bad measure stable; it does not make it the right measure. Do not switch back.
      #
      # It is a FLOOR, not the observed 45. Its job is to rule out an app that imported but registered
      # nothing. Asserting the exact count would turn every new endpoint into a red gate during correct
      # work, and the route list grows with the product. WebSocket routes are absent from OpenAPI by
      # design, so the three of them are not counted here.
      - name: App boots
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "tests")
          import _throwaway_db  # noqa: F401 - must run before any app import
          from app.main import app

          MIN_PATHS = 20  # floor; 45 observed under both 0.136.3 and 0.141.1, and now stable at
          # the 0.136.3 value because requirements.txt pins fastapi exactly.
          paths = len(app.openapi()["paths"])
          print(f"app.main imported, {paths} OpenAPI paths, {len(app.routes)} route objects")
          if paths < MIN_PATHS:
              print(f"FAIL: {paths} OpenAPI paths is below the floor of {MIN_PATHS}.")
              print("The app imported but registered almost nothing, so this proves nothing.")
              sys.exit(1)
          PY

      # Pyflakes rules only: unused imports, unused variables, empty f-strings. The wider ruff sets
      # carry hundreds of findings (44 on the classic E4,E7,E9,F set, 908 on ruff 0.16 defaults, most of
      # them SQLAlchemy and FastAPI idioms this codebase uses on purpose) and widening the selection is
      # a separate decision. The version is pinned exactly because an unpinned linter changes its own
      # rules under you and reds the gate on a day nobody touched the code.
      - name: Ruff (pyflakes rules)
        run: |
          python -m pip install ruff==0.16.4
          count=$(ruff check --select F --show-files . | wc -l)
          echo "ruff would check $count files"
          if [ "$count" -lt 80 ]; then
            echo "FAIL: ruff found only $count files to check, expected at least 80 (102 when this was written)."
            exit 1
          fi
          ruff check --select F .

      # Not "pytest tests". 12 of the 16 suites execute their whole body at import and share one app
      # instance, one in-memory rate limiter and the first module's temp SQLite file, so in one process
      # they collide: pytest collects 92 of about 979 assertions, hits 4 collection errors and
      # interrupts. Each suite gets its own process, which is what every suite docstring prescribes.
      #
      # The loop runs every suite even after one fails. A gate that stops at the first failure hides the
      # second problem and costs an extra round trip every time. A timeout is a failure like any other
      # here: it does not cancel the suites after it.
      #
      # Every suite runs under a timeout because on 2026-08-27 a run hung -- battle_test.py produced no
      # output for 19 minutes on a commit that touched one line of ARCHITECTURE.md, and the unchanged
      # re-run passed in 2.681 s. That hang is unexplained and was not investigated; one occurrence is
      # not enough to chase. What is fixed here is that it burned toward the six-hour default instead of
      # failing, and that the only way to learn which suite was stuck was to cancel the run.
      - name: Test suites
        run: |
          # Seconds allowed per suite. Derived from thumbnails_test.py, the slowest healthy suite at
          # about 130 s (arena_test.py about 29 s, every other suite under 10 s), so this is about 2.3x
          # the real worst case. The dangerous direction is DOWN: a timeout that fires on a
          # slow-but-healthy run converts a reliable gate into an unreliable one, which is the fastest
          # way to get a gate switched off, and hosted runner speed is not ours to control. Against 19
          # minutes of silence, 300 s is already the whole win; trimming to 240 s would buy one minute
          # and spend most of the headroom.
          SUITE_TIMEOUT=300

          # Only a SIGKILL at or after this many seconds is read as a timeout. See the KILLED branch.
          # timeout cannot fire before its own limit, so the only slack this needs is for measuring the
          # elapsed time in the shell; 10% is far more than that, and it stays far above the ~130 s of
          # the slowest healthy suite, which is the case it has to tell apart.
          TIMEOUT_FLOOR=$(( SUITE_TIMEOUT * 9 / 10 ))

          files=$(ls tests/*_test.py | sort)
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "found $count suite files"
          # A loop that globs nothing exits 0 and reports a green check having run no tests.
          if [ "$count" -lt 16 ]; then
            echo "FAIL: found $count suite files, expected at least 16."
            echo "Either the glob is wrong or suites were deleted; either way this step proves nothing."
            exit 1
          fi

          failed=0
          timedout=0
          summary="$RUNNER_TEMP/summary.txt"
          : > "$summary"
          for f in $files; do
            # Printed BEFORE the suite runs, and deliberately not redirected. Each suite's own output
            # goes to a file and is dumped only on failure, so during a hang the live log is otherwise
            # completely silent -- which is why the 2026-08-27 hang could only be attributed by
            # cancelling the run. This line is the difference between "something is stuck" and
            # "battle_test.py is stuck" while it is still happening, rather than 300 s later.
            echo "--> running $f (limit ${SUITE_TIMEOUT}s)"
            start=$(date +%s%N)
            rc=0
            timeout --signal=TERM --kill-after=10s "${SUITE_TIMEOUT}s" \
              python "$f" > "$RUNNER_TEMP/suite.log" 2>&1 || rc=$?
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            secs=$(( ms / 1000 ))

            if [ "$rc" -eq 0 ]; then
              status=PASS
            elif [ "$rc" -eq 124 ] || { [ "$rc" -eq 137 ] && [ "$secs" -ge "$TIMEOUT_FLOOR" ]; }; then
              # 124 is timeout firing at the limit with SIGTERM. 137 is SIGKILL, which --kill-after
              # sends when the suite ignored SIGTERM -- a plausible shape for a process wedged in a
              # socket wait, which is what the one observed hang looked like.
              status=TIMEOUT
              timedout=$((timedout + 1))
              failed=$((failed + 1))
            elif [ "$rc" -eq 137 ]; then
              # SIGKILL well inside the limit, so timeout did not send it: the kernel OOM killer sends
              # the same signal, and thumbnails_test.py is image-heavy and the most plausible OOM
              # candidate on a shared runner. Filing this under TIMEOUT would hide a second cause in
              # the same bucket, which is the exact reason TIMEOUT is not filed under FAIL.
              status=KILLED
              failed=$((failed + 1))
            else
              status=FAIL
              failed=$((failed + 1))
            fi

            line=$(printf '%-34s %-7s %d.%03ds' "$f" "$status" "$secs" "$((ms % 1000))")
            echo "$line"
            echo "$line" >> "$summary"
            if [ "$status" != PASS ]; then
              if [ "$status" = TIMEOUT ]; then
                echo "----- $f TIMED OUT after ${SUITE_TIMEOUT}s (rc $rc) -----"
                echo "It did not finish, so its output below is whatever it managed to print."
                echo "See the CI notes in CLAUDE.md for the 2026-08-27 battle_test.py hang."
              elif [ "$status" = KILLED ]; then
                echo "----- $f was SIGKILLed after ${secs}s, inside the ${SUITE_TIMEOUT}s limit -----"
                echo "This is NOT a timeout. The cause is unknown; the kernel OOM killer is the likely"
                echo "one, and this job has no memory instrumentation to confirm it."
              fi
              echo "----- $f output (last 40 lines) -----"
              tail -40 "$RUNNER_TEMP/suite.log"
              echo "----- end $f -----"
            fi
          done

          echo "===== summary ====="
          cat "$summary"
          echo "$count suites run, $failed failed ($timedout timed out)"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
