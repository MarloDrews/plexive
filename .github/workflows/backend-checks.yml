# Runs the backend's checks on every pull request, and on main after a merge.
#
# The backend was never unchecked, only unenforced: backend/tests/ is 16 suites, and smoke_test.py had
# been failing for five weeks before anyone looked. This workflow is the thing that looks. (16 is the
# count again as of 2026-08-28, having briefly been 17: thumbnails_test.py left with the thumbnail
# render subsystem. The assertion total is no longer quoted here because it was never re-counted.)
name: Backend checks

on:
  # Same shape as android-build.yml, and scoped to main for the same reason: an unscoped "push:" also
  # fires on the branch behind a pull request, so one commit gets two runs reporting the same
  # backend-checks name and the required check resolves to whichever finishes last.
  #
  # Deliberately no "paths:" filter. A workflow skipped by a top-level paths filter reports no status
  # at all, and a required check that never reports blocks the pull request permanently.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-checks:
    # This name is the identity of the required status check on main. Do not rename it casually.
    name: backend-checks
    runs-on: ubuntu-24.04
    # Backstop for a hang OUTSIDE the suite loop -- in pip install or the boot check -- where the
    # per-suite timeout below cannot help. Without it a hang burns toward GitHub's six-hour default,
    # which is what happened on 2026-08-27.
    #
    # About 5x the observed 3m37s-3m55s. It is deliberately not tighter, because the number is set by an
    # interaction and not by the margin alone: a job killed by timeout-minutes prints no summary table,
    # and that table is the only thing that names the suite that hung. One suite burning its full 300 s
    # puts the job near 9 minutes and two near 14, and both still print the summary inside 20.
    timeout-minutes: 20
    # A THROWAWAY POSTGRES, FOR THE SCHEMA LEDGER STEP ALONE. It is never production and it holds no
    # data: it is created empty and the migrations build it, which is exactly the thing being checked.
    #
    # 17 because production is PostgreSQL 17.6 -- read off the newest backup manifest
    # (OneDrive/plexive-backups/plexive-20260830T100001Z-manifest.txt, "server version : 17.6",
    # 2026-08-30), not assumed. The major is the pin for the same reason it is on setup-python: a
    # schema comparison is dialect behaviour, and the patch level of a Supabase instance is not ours.
    #
    # DATABASE_URL IS DELIBERATELY NOT SET AT JOB LEVEL. app/database.py reads it at import, and the
    # 16 suites depend on tests/_throwaway_db.py pinning it to a temp SQLite file before any app
    # module loads. A job-level value would be one more thing that has to lose that race, and it
    # would lose it silently. Only the schema-ledger step exports it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plexive_ci
        ports:
          - 5432:5432
        # Without a health check the job races the container: postgres accepts TCP before it accepts
        # queries, so the first alembic connection fails on a container that is merely slow.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        # The Linux default shell is "bash -e {0}", without pipefail, which is how a piped failure
        # turns into a green check. "shell: bash" is "bash --noprofile --norc -eo pipefail {0}".
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # 3.13 because production is 3.13.5. This used to say 3.12, on the reasoning that backend/.venv
      # is 3.12.10 and that was the only interpreter the suite had demonstrably passed on; that was
      # correct with the information available then. The Pi's freeze has since been read, and a gate
      # that tests a version nobody ships tests the wrong thing.
      #
      # The MINOR version is the pin, not the patch. Behavioural compatibility lives at the minor
      # version -- the failure this whole batch exists to fix was fastapi 0.136 against 0.141 -- and the
      # Pi's own patch level is not pinned either, so '3.13.5' here would only mirror production until
      # someone runs apt upgrade, after which the two would disagree silently. Floating the patch also
      # keeps picking up language security fixes, which we are already giving up on 69 packages.
      #
      # The Pi is on 3.13.5 today. A MINOR version bump there is a change to be matched here
      # deliberately, not discovered later.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The exact patch this run used, on its own, so a divergence from the Pi's 3.13.5 is one click
      # away in the log rather than invisible.
      - name: Python version
        run: python -V

      # .claude/rules/ IS A REPOSITORY-WIDE CONCERN CHECKED FROM A STACK JOB, and that is
      # deliberate. None of the three jobs reads outside its own working-directory today, so
      # "the job that already touches repository-wide state" did not pick itself; this one is
      # the only one of the three with a Python interpreter on PATH by design, which reading
      # frontmatter needs, and adding one to frontend-checks or android-build would mean
      # adding a setup step to a job that has none.
      #
      # WHAT IT REFUSES: a file under .claude/rules/ with no top-level paths: key. Such a file
      # loads GLOBALLY, at the same priority as CLAUDE.md, which makes the container the thing
      # it was created to replace. Measured 2026-08-31 on Claude Code 2.1.251, both directions:
      # an unscoped file loaded into a session that touched no file at all, and a paths:-scoped
      # file loaded only in the session that read a file its glob matched.
      - name: "Rules files under .claude/rules/ declare a paths: scope"
        working-directory: ${{ github.workspace }}
        run: |
          # DELETION DETECTOR, sitting exactly on the observed count rather than below it: 1
          # rules file, measured on the runner by the find below. A find that matches nothing
          # exits 0 and reports a green tick having checked no files, which is the reassuring
          # identical output this repository keeps recording. A rules file added later raises
          # this number; a rules file deleted has to be a deliberate edit here.
          MIN_RULES_FILES=1

          mapfile -t RULES < <(find .claude/rules -name '*.md' | sort)
          count=${#RULES[@]}
          echo "found $count rules file(s) under .claude/rules/"
          if [ "$count" -lt "$MIN_RULES_FILES" ]; then
            echo "FAIL: found $count rules file(s), expected at least $MIN_RULES_FILES."
            echo "Either .claude/rules/ moved or this step is checking nothing."
            exit 1
          fi

          # The frontmatter is PARSED rather than grepped. A bare `grep -q paths:` passes on a
          # file whose only paths: sits in the prose below the frontmatter, or is indented under
          # some other key, and both of those load globally exactly as a missing key does.
          python3 - "${RULES[@]}" <<'PY'
          import sys

          unscoped = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as fh:
                  # splitlines() handles CRLF and LF alike, which matters because
                  # core.autocrlf is on for the machine these files are written on.
                  lines = fh.read().splitlines()
              scoped = False
              # Frontmatter is the block between a first line that is exactly --- and the
              # next --- . Anything outside that block is prose and scopes nothing.
              if lines and lines[0].strip() == "---":
                  for line in lines[1:]:
                      if line.strip() == "---":
                          break
                      # Top level only: an indented paths: belongs to some other key. YAML
                      # forbids tabs for indentation, so a leading space is the whole test.
                      if line[:1] == " " or ":" not in line:
                          continue
                      if line.split(":", 1)[0].strip() == "paths":
                          scoped = True
                          break
              print("  %-8s %s" % ("scoped" if scoped else "UNSCOPED", path))
              if not scoped:
                  unscoped.append(path)

          print("UNSCOPED_RULES_FILES=%d of %d" % (len(unscoped), len(sys.argv) - 1))
          if unscoped:
              print("FAIL: %d rules file(s) carry no top-level paths: key." % len(unscoped))
              print("A rules file without paths: loads globally, at CLAUDE.md priority, in")
              print("every session. That is the thing .claude/rules/ exists to avoid, so it is")
              print("refused here rather than found later as a context bill nobody can see.")
              for path in unscoped:
                  print("  " + path)
              sys.exit(1)
          PY

      # Both files are now pinned to the exact versions production runs (see requirements.txt).
      # requirements-dev.txt carries httpx, which FastAPI's TestClient imports at runtime; its httpx
      # pin must equal the one in requirements.txt, and pip enforces that by failing with
      # ResolutionImpossible rather than silently choosing one.
      #
      # "time" stays because install duration is how a cache regression shows up. pip list stays as the
      # human-readable record; the machine-readable check is the next step.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          time python -m pip install -r requirements.txt -r requirements-dev.txt
          echo "--- resolved versions ---"
          python -m pip list

      # The point of pinning is not that it worked once, it is that it is still true in six months,
      # by which time nobody is reading install logs. This step is that assertion, mechanically.
      #
      # Exact equality in both directions. A package resolving HIGHER than its pin is precisely the
      # drift the pinning exists to stop, so it fails; "at least the pinned version" would pass the
      # very thing being guarded against.
      #
      # Markers: this runner is Linux, so every marker in requirements.txt is expected to resolve TRUE
      # and every marked package must therefore be present. Today that is uvloop alone. If a
      # sys_platform == "win32" marker is ever added, this check would demand a package pip correctly
      # skipped, and the fix is to evaluate the marker here rather than to delete the assertion.
      #
      # This check is one-directional on purpose: every pinned name must be installed at exactly its
      # pinned version, and an EXTRA package in pip freeze that neither file names is not an error.
      # That allowance used to exist for pip-audit's ~19 unpinned transitive packages; pip-audit left
      # requirements-dev.txt on 2026-08-31 and the allowance stays, because the ruff and mypy steps
      # below pip-install their own tools and pip's own bootstrap packages are not pinned either.
      - name: Verify pins resolved
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          # Anti-vacuity guard. A parser that matches nothing compares nothing and passes green, which
          # is the exact failure class every other step here already guards against; it would be
          # embarrassing for it to land inside the step built to prevent it. 64 unique pinned names
          # across both files, measured 2026-08-31 after pip-audit was REMOVED from
          # requirements-dev.txt (was 65 from 2026-08-28, when alembic and the Mako + MarkupSafe it
          # pulls in were added; 62 before that, and 70 before matplotlib's subtree left with the
          # render subsystem). Lowering this number is what a deliberate deletion looks like.
          #
          # ONE THING THIS FLOOR STOPPED WATCHING ON 2026-08-31, said out loud rather than left to be
          # discovered: all 64 pins now come from requirements.txt. requirements-dev.txt contributes
          # ZERO unique names, because its only remaining pin -- httpx==0.28.1 -- is deliberately a
          # duplicate of the one in requirements.txt, and this parser keys by package name. So
          # deleting that line would NOT move this count. It was pip-audit that made this floor watch
          # requirements-dev.txt at all. What still guards the httpx line is pip itself: the two pins
          # are installed in one invocation and pip fails with ResolutionImpossible if they diverge.
          # Measured 2026-08-31: deleting httpx from requirements-dev.txt leaves the count at 64;
          # deleting bcrypt from requirements.txt takes it to 63 and this step exits 1.
          # THIS IS A DELETION DETECTOR, not a collapse detector, and the two kinds of floor in this
          # file answer different questions. This one sits EXACTLY on the measured count, so removing
          # a dependency has to come here and change the number on purpose. The Syntax check and Ruff
          # floors deliberately sit well below theirs instead, because those exist to catch a collapse
          # and would otherwise red during ordinary deletion work. Do not make them uniform.
          MIN_PINS = 64

          pinned = {}
          for path in ("requirements.txt", "requirements-dev.txt"):
              with open(path, encoding="utf-8") as fh:
                  for raw in fh:
                      line = raw.split("#", 1)[0].strip()
                      if not line:
                          continue
                      line = line.split(";", 1)[0].strip()   # drop the environment marker
                      if "==" not in line:
                          continue
                      name, version = line.split("==", 1)
                      name = name.split("[", 1)[0].strip()   # drop extras: uvicorn[standard]
                      pinned[norm(name)] = (name, version.strip())

          print(f"parsed {len(pinned)} unique pinned packages from the two requirements files")
          if len(pinned) < MIN_PINS:
              print(f"FAIL: parsed only {len(pinned)} pins, expected at least {MIN_PINS}.")
              print("The parser matched almost nothing, so this step is comparing nothing.")
              sys.exit(1)

          frozen = {}
          for line in subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines():
              if "==" in line:
                  name, version = line.split("==", 1)
                  frozen[norm(name)] = version.strip()

          missing = sorted(k for k in pinned if k not in frozen)
          mismatched = sorted(
              (pinned[k][0], pinned[k][1], frozen[k])
              for k in pinned
              if k in frozen and frozen[k] != pinned[k][1]
          )

          for name in missing:
              print(f"MISSING: {pinned[name][0]}=={pinned[name][1]} is pinned but not installed")
          for name, want, got in mismatched:
              print(f"MISMATCH: {name} pinned {want}, resolved {got}")

          if missing or mismatched:
              print(f"FAIL: {len(missing)} missing, {len(mismatched)} mismatched.")
              print("pip did not install what the requirements files say. The pins are not in effect.")
              sys.exit(1)

          print(f"all {len(pinned)} pinned versions match what pip installed, exactly")
          PY

      # --- Cheapest first, so a failure surfaces fast. ---

      # A compileall over a path that does not exist still exits 0, so count the files first.
      #
      # THE COUNT AND THE COMPILE COME FROM ONE find, AND THAT IS THE POINT OF THIS SHAPE. They used
      # to be two different sets -- `find app scripts tests alembic` for the count and
      # `compileall app scripts tests alembic seed.py` for the work -- so the step could report a
      # healthy number while compiling something else. Measured 2026-08-31 on a tree where the three
      # top-level scripts had been consolidated into a package: compileall printed
      # `Can't list 'seed.py'` and EXITED 0. Three files silently stopped being compiled and the step
      # stayed green, which is the "a step that watches for a condition reports its own failure" rule
      # in CLAUDE.md failing in the quiet direction.
      #
      # `.` rather than four named directories, for the same reason the mypy step below takes `.`: a
      # new top-level package under backend/ was neither counted nor compiled here, and nothing said
      # so. .venv/ is excluded because a dev checkout has one and CI does not -- the number has to be
      # the same in both places or a local rehearsal is not a rehearsal.
      #
      # THIS IS A COLLAPSE DETECTOR. It exists to catch the paths moving or this step checking nothing,
      # so the floor sits well BELOW the observed count and normal work never reaches it. That is the
      # opposite of MIN_PINS and the suite-file floor, which sit exactly on their measured values so a
      # deletion has to be deliberate. Both kinds are correct for what they watch; do not unify them.
      # 82 .py files measured 2026-08-31 under `.`, which is the same 82 the ruff and mypy steps
      # report; it was 79 under the four named directories, the difference being the three top-level
      # scripts they never saw. THE FLOOR OF 60 DID NOT MOVE -- widening what is counted raised the
      # observed number, not the threshold.
      - name: Syntax check
        run: |
          # mapfile into an array, and "${PYFILES[@]}" quoted, rather than an unquoted $(find ...):
          # a filename with a space would otherwise reach compileall as two paths that do not exist,
          # and compileall exits 0 on those, which is the failure this whole step is being reshaped
          # to remove. The array length is the count, so the number and the argument list cannot
          # disagree.
          mapfile -t PYFILES < <(find . -name '*.py' -not -path './.venv/*' -not -path '*/__pycache__/*')
          count=${#PYFILES[@]}
          echo "found $count Python files under backend/"
          if [ "$count" -lt 60 ]; then
            echo "FAIL: only $count Python files found, expected at least 60 (82 when this was written)."
            echo "Either the paths moved or this step is checking nothing."
            exit 1
          fi
          python -m compileall -q "${PYFILES[@]}"

      # The check that matters most. This backend boot-fails on purpose on a weak JWT_SECRET, a missing
      # DATABASE_URL, WEB_CONCURRENCY > 1 and an empty CORS origin list, and a boot failure crash-loops
      # systemd on the Pi and takes the API down for the web app and the mobile app.
      # docs/SERVER.md:191-197 records that this has really happened.
      #
      # tests/_throwaway_db.py pins DATABASE_URL to a temp SQLite file and blanks the Supabase env
      # before any app module loads, so this can never reach a real database.
      #
      # The count is the number of OpenAPI paths, NOT len(app.routes), and it stays that way now that
      # fastapi is pinned. len(app.routes) was never stable across FastAPI versions -- 0.136.3 reports
      # 57, one flattened APIRoute per endpoint, while 0.141.1 (what CI resolved unpinned on
      # 2026-08-27) reports 23, because include_router leaves a single _IncludedRouter per router --
      # and with requirements.txt unpinned both were "correct" on the same day.
      #
      # Pinning fastapi==0.136.3 removes that drift, so the route count would now be stable too. It is
      # still the wrong thing to assert: the OpenAPI path count describes the API, while the route
      # count describes how the installed FastAPI happens to represent it internally. Pinning makes
      # the bad measure stable; it does not make it the right measure. Do not switch back.
      #
      # It is a FLOOR, not the observed 42. Its job is to rule out an app that imported but registered
      # nothing. Asserting the exact count would turn every new endpoint into a red gate during correct
      # work, and the route list grows with the product. WebSocket routes are absent from OpenAPI by
      # design, so the three of them are not counted here.
      - name: App boots
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "tests")
          import _throwaway_db  # noqa: F401 - must run before any app import
          from app.main import app

          MIN_PATHS = 20  # floor; 42 observed 2026-08-28, after the three /api/thumbnails/* endpoints
          # left with the render subsystem (45 before that, under both 0.136.3 and 0.141.1). Stable
          # because requirements.txt pins fastapi exactly.
          paths = len(app.openapi()["paths"])
          print(f"app.main imported, {paths} OpenAPI paths, {len(app.routes)} route objects")
          if paths < MIN_PATHS:
              print(f"FAIL: {paths} OpenAPI paths is below the floor of {MIN_PATHS}.")
              print("The app imported but registered almost nothing, so this proves nothing.")
              sys.exit(1)
          PY

      # THIS STEP MAKES TWO ASSERTIONS AND THEY ARE OF DIFFERENT KINDS. A later reader will assume
      # they match, because they run the same tool on the same tree three lines apart, so it is said
      # here first and again next to each number:
      #
      #   MAX_RUFF_FINDINGS over E4,E7,E9,F is a RATCHET. It fires UPWARD ONLY and has no lower
      #   bound. It refuses the 38th finding and says nothing whatever about the 37 already here.
      #
      #   The F selection is an ABSOLUTE. Exactly zero, and it fires in BOTH directions in the sense
      #   that there is nothing to fix: a single new unused import reds this gate on its own.
      #
      # WHY BOTH, RATHER THAN JUST THE WIDER ONE. F is a subset of E4,E7,E9,F, so widening the
      # selection would have silently converted the zero-tolerance pyflakes gate that has been in
      # force since 2026-08-27 into a 37-finding budget: a commit that adds an F401 while fixing an
      # E712 keeps the total at 37 and passes. Nobody decided to give that up, so it is kept.
      #
      # ruff 0.16 DEFAULTS ARE STILL NOT ADOPTED and that is a separate decision, not an oversight.
      # They carry 908 findings, most of them SQLAlchemy and FastAPI idioms this codebase uses on
      # purpose. `ruff format` is not run either. The version is pinned exactly because an unpinned
      # linter changes its own rules under you and reds the gate on a day nobody touched the code.
      - name: Ruff (E4,E7,E9,F ratchet, and F at zero)
        run: |
          python -m pip install ruff==0.16.4

          # THE RATCHET. 37, measured on this tree. The brief that asked for this step quoted 44,
          # which is the figure in repo-hygiene-inventory-2026-08.md and predates d38f89c; 37 is what
          # ruff 0.16.4 reports today: 33 E712, 3 E402, 1 E731. Confirmed on the runner before this
          # number was written -- see docs/CI_NOTES.md, "## The count floors and the two ratchets in
          # `backend-checks.yml`".
          #
          # IT COMES DOWN BY HAND, in the same commit as the batch that fixes findings, and never on
          # its own. There is deliberately no lower bound: a gate that reds because somebody fixed
          # three E712s is a gate firing on correct work, which is the inverse defect the "## Rules"
          # entry in CLAUDE.md keeps apart from the rest.
          MAX_RUFF_FINDINGS=37

          # COLLAPSE DETECTOR, same kind as the Syntax check floor above and set the same way.
          # 82 measured 2026-08-29 (was 80, then 81 when alembic/versions/0002 landed). Note this count
          # is deliberately THREE HIGHER than the Syntax check's: ruff runs over `.` from backend/, so
          # it also sees seed.py, download_seed_images.py and content_repo.py, which the Syntax check's
          # find does not. It was TWO higher until content_repo.py was added on 2026-08-29. Setting one
          # of these two floors from the other's number leaves this step red by the difference.
          count=$(ruff check --select E4,E7,E9,F --show-files . | wc -l)
          echo "ruff would check $count files"
          if [ "$count" -lt 60 ]; then
            echo "FAIL: ruff found only $count files to check, expected at least 60 (82 when this was written)."
            exit 1
          fi

          # ruff's exit codes are 0 (no findings), 1 (findings) and 2 (ruff itself failed). Only the
          # third is a broken checker, and it has to be told apart from the second: `|| true` alone
          # would turn a ruff that crashed into an empty findings list, which is a green tick meaning
          # nothing. JSON rather than counting lines of --output-format=concise, because that format
          # appends its own summary lines and `| wc -l` reported 39 for 37 findings when this was
          # written.
          rc=0
          ruff check --select E4,E7,E9,F --output-format=json . > "$RUNNER_TEMP/ruff.json" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "FAIL: ruff exited $rc, which is ruff failing rather than ruff finding something."
            cat "$RUNNER_TEMP/ruff.json"
            exit 1
          fi

          MAX_RUFF_FINDINGS="$MAX_RUFF_FINDINGS" REPORT="$RUNNER_TEMP/ruff.json" \
          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          max_findings = int(os.environ["MAX_RUFF_FINDINGS"])
          with open(os.environ["REPORT"], encoding="utf-8") as fh:
              findings = json.load(fh)

          by_code = Counter(f.get("code") for f in findings)
          print("RUFF_FINDINGS=%d" % len(findings))
          print("--- findings by code ---")
          for code, count in by_code.most_common():
              print("  %d  %s" % (count, code))
          for f in findings:
              where = f.get("filename", "(no file)")
              line = (f.get("location") or {}).get("row")
              if line:
                  where = "%s:%s" % (where, line)
              print("  %s  %s  %s" % (f.get("code"), where, f.get("message")))

          if len(findings) > max_findings:
              print(
                  "FAIL: %d findings on E4,E7,E9,F, above the RATCHET of %d.\n"
                  "      This job refuses NEW findings and accepts the %d already here.\n"
                  "      Fix the ones this branch added, or lower MAX_RUFF_FINDINGS in the same\n"
                  "      commit as the batch that fixes findings. It never comes down on its own."
                  % (len(findings), max_findings, max_findings)
              )
              raise SystemExit(1)

          print("OK: %d findings, at or under the RATCHET of %d." % (len(findings), max_findings))
          PY

          # THE ABSOLUTE, and it is last so its output is the last thing in the step. Zero pyflakes
          # findings, no budget, no ratchet. This is the assertion the ratchet above cannot make.
          echo "--- F (pyflakes) must be exactly zero ---"
          ruff check --select F .

      # MYPY SHIPS AS A RATCHET, AND THAT IS A WEAKER CHECK THAN IT LOOKS. Adopting a type checker at
      # zero is a session nobody has scheduled -- 201 errors is a batch of work, not a typo. Adopting
      # it not at all leaves the number free to grow. So what this asserts is only that the next batch
      # does not add one more, and that is the whole claim. It is chosen deliberately over the two
      # alternatives, not settled for.
      #
      # THE PATH SET AND THE FLAGS ARE PART OF WHAT THE NUMBER MEANS, so they are here beside it
      # rather than only in a report. Somebody who has to change MAX_MYPY_ERRORS needs to know what it
      # counted.
      #
      #   Path: `.` -- THE SAME ARGUMENT RUFF GETS, and that is the whole point of it being one
      #   character. NOTHING IS EXCLUDED. mypy reports "checked 82 source files", which is the same 82
      #   the ruff floor above counts, and .venv/ and __pycache__/ are skipped by mypy itself rather
      #   than by a flag here (measured 2026-08-31 on a tree that has a .venv). alembic/ is in it,
      #   versions/ included: mypy 2.3.1 accepts 0001_baseline.py and 0002_drop_redundant_indexes.py
      #   despite the leading digits, so the exclusion that was expected to be necessary is not.
      #
      #   IT USED TO BE `app scripts tests alembic *.py`, AND THAT NAME LIST FIRED ON CORRECT WORK IN
      #   ONE DIRECTION AND WENT BLIND IN THE OTHER. Both were reproduced on 2026-08-31, not argued:
      #     -- Consolidating the three top-level scripts into a package leaves the glob unmatched,
      #        bash leaves it literal, mypy exits 2 on a path that does not exist, and the step
      #        printed "mypy exited 2, which is mypy failing rather than mypy finding something",
      #        which is FALSE. mypy was fine; the argument list was empty. An ordinary refactor red a
      #        required check with a message that blamed the tool.
      #     -- A new top-level PACKAGE -- backend/services/ -- was checked by ruff, which runs over
      #        `.`, and not by mypy, which took a list of four names. Measured: ruff 83 files, mypy
      #        82, and a plain type error in it was invisible while both steps reported green. The
      #        earlier fix closed that hole for top-level FILES and left it open for directories.
      #   `.` closes both and it moves no number: measured 2026-08-31, `mypy .` and
      #   `mypy app scripts tests alembic *.py` both report "Found 201 errors in 34 files (checked 82
      #   source files)" on this tree. The stored inputs that prove it are in tools/correct-work/.
      #
      #   Flags: none beyond --cache-dir. In particular NOT --ignore-missing-imports. CI installs the
      #   full pinned dependency set, so mypy sees real dependency types, and suppressing the
      #   difference would make the number smaller for a reason that has nothing to do with this
      #   codebase. Measured on app/ alone: 164 errors without the flag, 160 with it.
      #
      #   4 of the errors are [import-untyped] -- "Library stubs not installed" for jose, lxml and
      #   defusedxml (x2). Installing types-* packages would take the count DOWN by four, which the
      #   ratchet permits silently, and that is the expected direction. Do not add them here in order
      #   to move the number; that would be a separate decision about what mypy is allowed to see.
      #
      # --cache-dir points into RUNNER_TEMP so no .mypy_cache is written into the checkout. There is
      # no .gitignore entry for it, and this step is not the place to add one.
      - name: Mypy (ratchet)
        run: |
          # Pinned by exact version for the same reason ruff is: an unpinned type checker changes its
          # own inference under you and moves the count on a day nobody touched the code. mypy is
          # deliberately NOT in requirements-dev.txt -- it is a CI tool, not a test dependency, and
          # this follows the `pip install ruff==` precedent one step above.
          python -m pip install mypy==2.3.1

          # THE RATCHET. 201, measured on this tree with the paths and flags named above. Fires
          # UPWARD ONLY, exactly like MAX_RUFF_FINDINGS one step above. There are FOUR ratchets in
          # this repository and they are listed once, in docs/CI_NOTES.md under "## Conventions every
          # job follows"; the other two are MAX_ERRORS in frontend-checks.yml and MAX_LINT_FINDINGS in
          # android-build.yml. Do not write "the first" or "the only" about any of them here again:
          # three batches each did, on three branches, and all three were false the moment they merged.
          # No lower bound, and it comes down by hand in the same commit as the batch that fixes
          # errors. The earlier figures of 64 and 261 in repo-hygiene-inventory-2026-08.md were taken
          # with a different mypy and a different question; they are not comparable to this one.
          MAX_MYPY_ERRORS=201
          #
          # THE RESIDUAL, BECAUSE THE INPUTS TO THIS NUMBER ARE NOT ALL PINNED, and a number whose
          # inputs float is a number that reds a pull request which changed nothing. Written here
          # rather than in a report, because whoever has to argue with a red gate is reading this.
          #
          # WHAT CANNOT DRIFT: the runtime dependency set. requirements.txt and requirements-dev.txt
          # are pinned exactly and the "Verify pins resolved" step above asserts equality in both
          # directions, so mypy always sees the same dependency types.
          #
          # WHAT CAN, three things, none of them large but none of them zero:
          #   1. `pip install mypy==2.3.1` pulls four packages with NO version constraint. From the
          #      log of run 33343673759: ast-serialize 0.8.0, librt 0.15.0, mypy_extensions 1.1.0,
          #      pathspec 1.1.1. The pins step runs BEFORE this install and tolerates extras, so
          #      nothing watches them.
          #   2. setup-python pins '3.13', the minor only. The patch floats, deliberately, and mypy's
          #      view of the standard library moves with it.
          #   3. This number is measured on the runner. A local reading is a different measurement.
          #
          # HOW BIG. Measured 2026-08-31 in both directions: removing ONE runtime package moved the
          # count by 65 -- 251 with sqlalchemy 2.0.50 installed, 186 without it, the same 82 files
          # checked and no tracked file changed. That is the scale of what an unpinned import can do
          # here, and it is why an unexplained move in this number is a question about the
          # environment before it is a question about the code.
          #
          # WHICH DIRECTION HURTS. Drift that LOWERS the count passes silently, because the ratchet
          # has no lower bound, and masks whatever it hides. Drift that raises it reds a pull request
          # that changed nothing. The first is the quieter and the worse of the two.

          # COLLAPSE DETECTOR, the same kind as the two file-count floors above. A mypy that resolves
          # none of its arguments prints "checked 0 source files" and exits 0, which is the reassuring
          # output. 82 observed; the floor sits well below it so ordinary deletion work never reaches
          # it. It is now the collapse detector for the SCOPE as well: with `.` as the argument, a
          # directory that stops being reachable shows up here as a falling file count rather than
          # as silence.
          MIN_MYPY_FILES=60

          # 0 = clean, 1 = errors found, 2 = mypy itself failed. Only the third is a broken checker.
          rc=0
          python -m mypy --cache-dir "$RUNNER_TEMP/mypy-cache" \
            . \
            > "$RUNNER_TEMP/mypy.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/mypy.log"
          if [ "$rc" -gt 1 ]; then
            echo "FAIL: mypy exited $rc, which is mypy failing rather than mypy finding something."
            exit 1
          fi

          MAX_MYPY_ERRORS="$MAX_MYPY_ERRORS" MIN_MYPY_FILES="$MIN_MYPY_FILES" \
          LOG="$RUNNER_TEMP/mypy.log" \
          python3 - <<'PY'
          import os
          import re
          from collections import Counter

          max_errors = int(os.environ["MAX_MYPY_ERRORS"])
          min_files = int(os.environ["MIN_MYPY_FILES"])
          with open(os.environ["LOG"], encoding="utf-8", errors="replace") as fh:
              text = fh.read()

          found = re.search(
              r"^Found (\d+) errors? in \d+ files? \(checked (\d+) source files?\)$",
              text, re.M,
          )
          clean = re.search(r"^Success: no issues found in (\d+) source files?$", text, re.M)

          # ANTI-VACUITY. If neither summary line is present the two regexes below would yield None,
          # a comparison against 0 would pass, and this step would report green having parsed
          # nothing. mypy always prints one of the two; its absence means mypy did not finish or
          # changed its output format, and either way this step is measuring nothing.
          if found:
              errors, files = int(found.group(1)), int(found.group(2))
          elif clean:
              errors, files = 0, int(clean.group(1))
          else:
              print("FAIL: no mypy summary line in the output above.")
              print("      Expected 'Found N errors in M files (checked K source files)' or")
              print("      'Success: no issues found in K source files'. Neither is there, so this")
              print("      step parsed nothing and its result would mean nothing.")
              raise SystemExit(1)

          by_code = Counter(m.group(1) for m in re.finditer(r"\[([a-z][a-z-]+)\]\s*$", text, re.M))
          print("MYPY_ERRORS=%d MYPY_FILES_CHECKED=%d" % (errors, files))
          print("--- by error code (includes non-error notes such as annotation-unchecked) ---")
          for code, count in by_code.most_common():
              print("  %d  %s" % (count, code))

          problems = []
          if files < min_files:
              problems.append(
                  "FAIL: mypy checked only %d source files, expected at least %d (82 when this\n"
                  "      was written). Either the paths moved or this step checked nothing."
                  % (files, min_files)
              )
          if errors > max_errors:
              problems.append(
                  "FAIL: %d mypy errors, above the RATCHET of %d.\n"
                  "      This job refuses NEW errors and accepts the %d already here.\n"
                  "      Fix the ones this branch added, or lower MAX_MYPY_ERRORS in the same\n"
                  "      commit as the batch that fixes errors. It never comes down on its own."
                  % (errors, max_errors, max_errors)
              )

          for problem in problems:
              print(problem)
          if problems:
              raise SystemExit(1)

          print("OK: %d errors across %d checked files, at or under the RATCHET of %d."
                % (errors, files, max_errors))
          PY

      # THE SCHEMA LEDGER, AND IT NEVER TOUCHES PRODUCTION. alembic.ini and a two-revision tree have
      # existed since 2026-08-28 and no alembic command ran anywhere, so schema drift was ungated:
      # alembic reached this job only as a directory argument to `find` and `compileall` above.
      #
      # WHAT IT ACTUALLY PROVES, stated narrowly because the task name invites a wider reading: that
      # `alembic upgrade head` against an EMPTY database produces the schema models.py describes. It
      # says nothing about production, which sits at 0001 while head is 0002 and carries three
      # redundant indexes 0002 exists to drop (CLAUDE.md, "## Schema Migrations"). A migration that is
      # correct here can still be unapplied there, and only scripts/schema_diff.py run by hand against
      # the live database answers that.
      #
      # WHY A CONTAINER RATHER THAN SQLITE. models.py declares JSONB variants (0001_baseline.py:121-131)
      # and the comparison policy sets compare_type=True (alembic/policy.py:64-71), so a SQLite
      # comparison would report differences that are artefacts of the dialect. The container is
      # PostgreSQL 17 against production's 17.6.
      #
      # `alembic check` EXITS 127 ON DETECTED DRIFT, which is worth knowing before it happens: 127 is
      # normally "command not found", and the obvious reading of a red step here is that alembic is
      # not installed. It is alembic's own CommandError exit. Measured both ways on 2026-08-31 -- 0
      # with "No new upgrade operations detected.", 127 with the operations listed.
      #
      # PLEXIVE_DB_WRITE=1 is scoped to the upgrade command alone and not to the step or the job.
      # alembic/env.py:66-102 refuses upgrade/downgrade/stamp/merge without it, and the value of that
      # guard is that setting it is a deliberate act; exporting it once at the top of a step is how it
      # stops being one.
      - name: Schema ledger (alembic upgrade, then alembic check)
        env:
          # The service container from the job's services: block. Never a real database.
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/plexive_ci
        run: |
          # Anti-vacuity: an empty versions/ makes `upgrade head` a silent no-op against an empty
          # database, after which `alembic check` compares nothing to nothing and passes.
          MIN_REVISIONS=2
          # 13 observed on 2026-08-31: 12 application tables plus alembic_version. A floor, not the
          # observed count, for the same reason MIN_PATHS is a floor -- the table list grows.
          MIN_TABLES=10

          # Say which database this reached, BEFORE anything runs. alembic/env.py announces the same
          # thing from inside (its "[alembic] online target:" line), but that only appears once
          # alembic starts; if the container is unreachable this line is the one that survives. Same
          # reasoning as main.py's closed-beta announcement: a setting invisible until it goes wrong
          # is the one that goes wrong.
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["DATABASE_URL"])
          print("[schema-ledger] target: scheme=%s host=%s port=%s db=%s user=%s (password redacted)"
                % (u.scheme, u.hostname, u.port, (u.path or "").lstrip("/"), u.username))
          PY

          revisions=$(find alembic/versions -name '*.py' -not -path '*/__pycache__/*' | wc -l)
          echo "found $revisions revision files under alembic/versions/"
          if [ "$revisions" -lt "$MIN_REVISIONS" ]; then
            echo "FAIL: found $revisions revision files, expected at least $MIN_REVISIONS."
            echo "An empty versions/ makes 'upgrade head' a no-op and 'check' vacuous."
            exit 1
          fi

          echo "--- alembic upgrade head ---"
          PLEXIVE_DB_WRITE=1 alembic upgrade head

          echo "--- tables built by the migrations ---"
          tables=$(python3 - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              print(conn.execute(text(
                  "select count(*) from information_schema.tables where table_schema = 'public'"
              )).scalar_one())
          PY
          )
          echo "public schema holds $tables tables"
          if [ "$tables" -lt "$MIN_TABLES" ]; then
            echo "FAIL: $tables tables after 'upgrade head', expected at least $MIN_TABLES."
            echo "The migrations ran and built almost nothing, so 'check' below would prove nothing."
            exit 1
          fi

          # `alembic current` prints NOTHING at all against a database that was never migrated, and
          # exits 0 doing it. grep is what turns that silence into a failure.
          echo "--- alembic current ---"
          alembic current | tee "$RUNNER_TEMP/alembic-current.txt"
          if ! grep -q "(head)" "$RUNNER_TEMP/alembic-current.txt"; then
            echo "FAIL: 'alembic current' does not report the database at head."
            exit 1
          fi

          # THE ASSERTION. Non-zero fails the job, and there is deliberately NO RATCHET on it. A
          # ratchet here would be a drift detector told to ignore drift, which is the exact shape this
          # whole batch exists to remove. It is exactly clean on this tree; the day it is not, the
          # answer is a migration, not a bigger number.
          echo "--- alembic check ---"
          alembic check

      # Not "pytest tests". 12 of the 16 suites execute their whole body at import and share one app
      # instance, one in-memory rate limiter and the first module's temp SQLite file, so in one process
      # they collide: pytest collects 92 of about 979 assertions, hits 4 collection errors and
      # interrupts. Each suite gets its own process, which is what every suite docstring prescribes.
      #
      # The loop runs every suite even after one fails. A gate that stops at the first failure hides the
      # second problem and costs an extra round trip every time. A timeout is a failure like any other
      # here: it does not cancel the suites after it.
      #
      # Every suite runs under a timeout because on 2026-08-27 a run hung -- battle_test.py produced no
      # output for 19 minutes on a commit that touched one line of ARCHITECTURE.md, and the unchanged
      # re-run passed in 2.681 s. That hang is unexplained and was not investigated; one occurrence is
      # not enough to chase. What is fixed here is that it burned toward the six-hour default instead of
      # failing, and that the only way to learn which suite was stuck was to cancel the run.
      - name: Test suites
        run: |
          # Seconds allowed per suite. This used to be derived as about 2.3x thumbnails_test.py at
          # about 130 s, the slowest healthy suite. That suite left with the thumbnail render subsystem
          # on 2026-08-28, so THE DERIVATION IS RESTATED RATHER THAN LEFT POINTING AT A FILE THAT NO
          # LONGER EXISTS: the slowest healthy suite is now arena_test.py at about 29 s in CI (32.9 s
          # measured locally on 2026-08-28), every other suite is under 20 s, and 300 s is therefore
          # about 10x the real worst case rather than 2.3x.
          #
          # IT IS DELIBERATELY NOT LOWERED TO MATCH. This limit exists to bound an UNBOUNDED HANG, not
          # to bracket a slow run, and against the 19 minutes of silence that put it here 300 s is
          # already the whole win. A bigger multiple costs nothing and buys margin on a shared runner.
          # The dangerous direction is DOWN: a timeout that fires on a
          # slow-but-healthy run converts a reliable gate into an unreliable one, which is the fastest
          # way to get a gate switched off, and hosted runner speed is not ours to control. Trimming to
          # 240 s would buy one minute and spend headroom that costs nothing to keep.
          SUITE_TIMEOUT=300

          # No core file. SIGABRT below is otherwise entitled to write one next to the dump.
          ulimit -c 0

          # Only a SIGKILL at or after this many seconds is read as a timeout. See the KILLED branch.
          # timeout cannot fire before its own limit, so the only slack this needs is for measuring the
          # elapsed time in the shell; 10% is far more than that, and it stays far above the ~29 s of
          # arena_test.py, now the slowest healthy suite, which is the case it has to tell apart.
          TIMEOUT_FLOOR=$(( SUITE_TIMEOUT * 9 / 10 ))

          files=$(ls tests/*_test.py | sort)
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "found $count suite files"
          # A loop that globs nothing exits 0 and reports a green check having run no tests.
          #
          # DELETION DETECTOR, the same kind as MIN_PINS and the opposite of the two floors above: it
          # sits exactly on the observed count so a removed suite has to be a deliberate edit here.
          # THIS FLOOR NOW HAS ZERO MARGIN. There were 17 suites against a floor of 16; thumbnails_test.py
          # left on 2026-08-28 and there are exactly 16. The next suite deleted for any reason reds this
          # gate, which is the intended behaviour and is written down so it is not a surprise.
          if [ "$count" -lt 16 ]; then
            echo "FAIL: found $count suite files, expected at least 16."
            echo "Either the glob is wrong or suites were deleted; either way this step proves nothing."
            exit 1
          fi

          failed=0
          timedout=0
          summary="$RUNNER_TEMP/summary.txt"
          : > "$summary"
          for f in $files; do
            # Printed BEFORE the suite runs, and deliberately not redirected. Each suite's own output
            # goes to a file and is dumped only on failure, so during a hang the live log is otherwise
            # completely silent -- which is why the 2026-08-27 hang could only be attributed by
            # cancelling the run. This line is the difference between "something is stuck" and
            # "battle_test.py is stuck" while it is still happening, rather than 300 s later.
            # ABRT, not the default TERM, and -X faulthandler: this is what turns the next
            # hang into evidence. -X faulthandler dumps every thread's stack when the
            # interpreter takes a FATAL signal -- SIGSEGV/SIGFPE/SIGABRT/SIGBUS/SIGILL, and
            # NOT SIGTERM. Measured on this runner: -X faulthandler with SIGTERM prints
            # nothing at all, exactly as before, so the flag alone would have been a no-op.
            # ABRT is the member of that set that means "abort now", and it dumps and dies.
            #
            # The exit code is unchanged at 124, so the classification below is untouched:
            # GNU timeout reports 124 for a timeout whatever signal it sent, unless
            # --preserve-status. Measured here as 124 for TERM and ABRT alike. The 137 branch
            # still matters, because --kill-after can still SIGKILL a suite that somehow
            # survives ABRT.
            #
            # Rejected alternative: faulthandler.register(SIGTERM) from a sitecustomize on
            # PYTHONPATH, which needs no signal change. It dumps, but register() does not
            # terminate, so the suite outlived its own dump and --kill-after SIGKILLed it:
            # exit 137, landing in the KILLED branch that exists to flag a suspected OOM.
            # Buying a traceback by making a timeout look like an OOM is a bad trade.
            echo "--> running $f (limit ${SUITE_TIMEOUT}s)"
            start=$(date +%s%N)
            rc=0
            timeout --signal=ABRT --kill-after=10s "${SUITE_TIMEOUT}s" \
              python -X faulthandler "$f" > "$RUNNER_TEMP/suite.log" 2>&1 || rc=$?
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            secs=$(( ms / 1000 ))

            if [ "$rc" -eq 0 ]; then
              status=PASS
            elif [ "$rc" -eq 124 ] || { [ "$rc" -eq 137 ] && [ "$secs" -ge "$TIMEOUT_FLOOR" ]; }; then
              # 124 is timeout firing at the limit with SIGTERM. 137 is SIGKILL, which --kill-after
              # sends when the suite ignored SIGTERM -- a plausible shape for a process wedged in a
              # socket wait, which is what the one observed hang looked like.
              status=TIMEOUT
              timedout=$((timedout + 1))
              failed=$((failed + 1))
            elif [ "$rc" -eq 137 ]; then
              # SIGKILL well inside the limit, so timeout did not send it: the kernel OOM killer sends
              # the same signal. The named candidate used to be thumbnails_test.py, which was
              # image-heavy; it left on 2026-08-28 and no remaining suite is an obvious OOM risk, so
              # this branch now flags a cause nobody has a suspect for -- which is more reason to keep
              # it distinct, not less. Filing this under TIMEOUT would hide a second cause in
              # the same bucket, which is the exact reason TIMEOUT is not filed under FAIL.
              status=KILLED
              failed=$((failed + 1))
            else
              status=FAIL
              failed=$((failed + 1))
            fi

            line=$(printf '%-34s %-7s %d.%03ds' "$f" "$status" "$secs" "$((ms % 1000))")
            echo "$line"
            echo "$line" >> "$summary"
            if [ "$status" != PASS ]; then
              if [ "$status" = TIMEOUT ]; then
                echo "----- $f TIMED OUT after ${SUITE_TIMEOUT}s (rc $rc) -----"
                echo "It did not finish, so its output below is whatever it managed to print."
                echo "See docs/CI_NOTES.md for the 2026-08-27 battle_test.py hangs."
                echo "It was aborted under -X faulthandler, so the output should END with an"
                echo "all-thread stack dump naming where every thread was standing. If there"
                echo "is no dump, THAT is the finding: report it rather than re-running."
                echo "----- $f FULL output (not tailed: the dump is the evidence) -----"
                cat "$RUNNER_TEMP/suite.log"
                echo "----- end $f -----"
                continue
              elif [ "$status" = KILLED ]; then
                echo "----- $f was SIGKILLed after ${secs}s, inside the ${SUITE_TIMEOUT}s limit -----"
                echo "This is NOT a timeout. The cause is unknown; the kernel OOM killer is the likely"
                echo "one, and this job has no memory instrumentation to confirm it."
              fi
              echo "----- $f output (last 40 lines) -----"
              tail -40 "$RUNNER_TEMP/suite.log"
              echo "----- end $f -----"
            fi
          done

          echo "===== summary ====="
          cat "$summary"
          echo "$count suites run, $failed failed ($timedout timed out)"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
