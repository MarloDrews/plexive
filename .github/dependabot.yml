# Dependabot: security updates only, deliberately not version updates.
#
# WHY THE FILE EXISTS AT ALL. Dependabot SECURITY updates are a repository setting, not a setting in
# this file -- they are on, and they would work with no dependabot.yml present. Version updates are the
# opposite: they exist only because this file lists an ecosystem. So every block below is a version
# update block that has been switched off, and the file's real job is to say out loud which ecosystems
# exist and that the stream of version bumps was refused on purpose.
#
# WHY VERSION UPDATES ARE OFF. backend/requirements.txt pins all 69 packages by hand, transitive ones
# included, and there is no lockfile. Version updates over that set would open a pull request per
# package per release, for packages nobody is waiting on. That is the documented way this feature ends
# up muted, and a muted Dependabot also hides the security pull requests that are the point.
#
# HOW IT IS SWITCHED OFF. "open-pull-requests-limit: 0" disables version updates for that ecosystem.
# Security update pull requests are explicitly not subject to this limit and do not count toward it,
# so setting it to 0 leaves exactly the half that pays for the pinning decision.
#
# Do not add "groups:" or "cooldown:" here. Both only affect version updates, which are off, so they
# would configure nothing. That is a separate decision to make after seeing the security volume.
version: 2

updates:
  # The pinned backend. This is the ecosystem the whole batch is for: pinning every transitive package
  # means none of them receives a security update on its own any more, so the security half below is
  # what pays for that decision. It carries more weight since 2026-08-31, when pip-audit was removed
  # from requirements-dev.txt: it had been installed on every CI run and called by nothing, and one of
  # the three reasons for removing it rather than wiring it up was that these alerts already cover
  # backend/requirements.txt. This is now the only automated dependency scanning the backend has.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The workflows pin action versions (actions/checkout@v5, gradle/actions/setup-gradle@v4 and so on),
  # which is a dependency set like any other. Directory is the repository root, not .github/workflows:
  # for this ecosystem the root is where Dependabot looks for the workflow directory.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

# NOT LISTED, on purpose.
#
# gradle for mobile-kmp/. Dependabot supports the gradle ecosystem in a subdirectory, and the layout
# here is the standard one it expects (mobile-kmp/gradle/libs.versions.toml). It still needs no block:
# security updates are repository-wide and need nothing listed here, while a block would only add a
# version update stream to switch off.
#
# What changed on 2026-08-27 is the thing UNDER the alerts. Security updates are driven by Dependabot
# ALERTS, alerts are driven by the dependency graph, and the dependency graph does not parse Gradle
# statically -- unlike Maven, Gradle reaches the graph only through the Dependency Submission API,
# which means running a real Gradle build. Before that date the repository SBOM listed 1268 packages
# and not one Maven coordinate, so mobile-kmp/ had no dependency scanning at all and a gradle block
# would have parsed fine and never produced a pull request. .github/workflows/dependency-submission.yml
# now submits the resolved graph on every push to main: the SBOM went from 1268 packages and 0 Maven
# coordinates to 1965 and 696, so the coordinates are there to raise alerts against. Whether they in
# turn produce pull requests is an observation still to be made. What did arrive within the hour is
# the alerts: mobile-kmp/ went from 0 to 50 (1 critical, 21 high, 26 medium, 2 low), all filed against
# mobile-kmp/settings.gradle.kts and dominated by build-tooling coordinates (io.netty:*,
# kotlin-gradle-plugin, bouncycastle). None triaged; see docs/RULE_HISTORY.md before reading the number as 50
# things shipping in the app.
# (The React Native app at mobile/ was deleted on 2026-08-27, so the npm block that used to be
# described here as deliberately absent is now moot in both directions. Its three open alerts --
# uuid and two against image-size, all filed on mobile/package-lock.json -- close with the manifest.)
